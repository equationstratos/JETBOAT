<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <title>JETBOAT — Visualiseur 3D</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚤</text></svg>"/>
  <style>
    :root {
      --bg: #0d1117; --panel: #161b22; --border: #30363d;
      --text: #e6edf3; --muted: #8b949e; --accent: #ff5500; --accent2: #f78166;
      --ui-w: 286px
    }
    @media (max-width: 640px) { :root { --ui-w: 250px } }
    * { box-sizing: border-box; margin: 0; padding: 0 }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text) }
    #canvas-wrap { position: absolute; inset: 0 }
    canvas { display: block; width: 100%; height: 100%; touch-action: none }
    /* Le panneau et sa poignée s'escamotent par `transform` seul : la boucle de
       rendu WebGL sature le thread principal, une transition sur `left` ou
       `width` s'y ferait étrangler. `will-change` les isole sur leur propre
       couche de composition, la transition reste donc fluide au montage.     */
    #ui { position: absolute; top: 0; left: 0; bottom: 0; width: var(--ui-w); background: rgba(22,27,34,.94); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 10; overflow-y: auto; will-change: transform; transition: transform .28s cubic-bezier(.4,0,.2,1) }
    body.ui-off #ui { transform: translateX(-100%) }
    #ui-toggle { position: absolute; top: 12px; left: 8px; z-index: 12; width: 30px; height: 30px; padding: 0; display: flex; align-items: center; justify-content: center; font-size: .95rem; line-height: 1; will-change: transform; transform: translateX(var(--ui-w)); transition: transform .28s cubic-bezier(.4,0,.2,1) }
    body.ui-off #ui-toggle { transform: none }
    #ui-toggle .arr { display: block; transition: transform .28s cubic-bezier(.4,0,.2,1) }
    body.ui-off #ui-toggle .arr { transform: rotate(180deg) }
    @media (prefers-reduced-motion: reduce) { #ui, #ui-toggle, #ui-toggle .arr { transition: none } }
    #ui header { padding: 14px 16px 10px; border-bottom: 1px solid var(--border) }
    #ui header h1 { font-size: 1.1rem; font-weight: 700 }
    #ui header p { font-size: .72rem; color: var(--muted); margin-top: 3px }
    .section { padding: 10px 14px; border-bottom: 1px solid var(--border) }
    .section h2 { font-size: .65rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between }
    .btn-row { display: flex; gap: 5px; flex-wrap: wrap }
    button { background: #21262d; border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 6px; font-size: .78rem; cursor: pointer }
    button:hover { background: #30363d }
    button:disabled { opacity: .35; cursor: default }
    button:disabled:hover { background: #21262d }
    button.active { background: var(--accent); border-color: var(--accent); color: #0d1117; font-weight: 600 }
    button.primary { background: var(--accent2); border-color: var(--accent2); color: #0d1117; font-weight: 600; flex: 1 }
    input[type=range] { width: 100%; accent-color: var(--accent) }
    label.chk { display: flex; align-items: center; gap: 7px; font-size: .78rem; padding: 2px 0; cursor: pointer }
    label.chk .qty { margin-left: auto; color: var(--muted); font-size: .68rem; font-variant-numeric: tabular-nums }
    label.chk .sw { width: 9px; height: 9px; border-radius: 2px; flex: none }
    #parts-list { max-height: 300px; overflow-y: auto; padding-right: 2px }
    .grp-title { font-size: .62rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 9px 0 3px }
    .grp-title:first-child { margin-top: 0 }
    #phase { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); background: rgba(22,27,34,.96); border: 1px solid var(--border); border-radius: 10px; padding: 8px 16px; z-index: 20; font-size: .82rem; opacity: 0; transition: opacity .25s; pointer-events: none; white-space: nowrap }
    #phase.on { opacity: 1 }
    body.guide #phase { display: none }

    /* fiche d'étape du guide */
    #card { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); width: min(620px, calc(100vw - 40px)); background: rgba(22,27,34,.97); border: 1px solid var(--border); border-radius: 12px; z-index: 21; display: none; box-shadow: 0 10px 34px rgba(0,0,0,.45) }
    body.guide #card { display: block }
    #card .bar { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--border) }
    #card .bar .num { font-size: .68rem; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; white-space: nowrap }
    #card .bar .ttl { font-weight: 650; font-size: .95rem; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
    #card .bar button { width: 30px; height: 28px; padding: 0; flex: none }
    #card .body { padding: 11px 13px 13px; max-height: 34vh; overflow-y: auto }
    #card .body p { font-size: .82rem; line-height: 1.5 }
    #card .tip { margin-top: 9px; font-size: .76rem; line-height: 1.45; color: #ffd0ad; background: rgba(255,85,0,.09); border-left: 2px solid var(--accent); padding: 7px 10px; border-radius: 0 6px 6px 0 }
    #card .tip b { color: var(--accent2); font-weight: 600 }
    #card .bom { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px }
    #card .bom span { font-size: .72rem; background: #21262d; border: 1px solid var(--border); border-radius: 20px; padding: 3px 9px; display: flex; align-items: center; gap: 6px }
    #card .bom i { width: 8px; height: 8px; border-radius: 2px; display: block }
    #card .prog { height: 3px; background: #21262d; border-radius: 0 0 11px 11px; overflow: hidden }
    #card .prog i { display: block; height: 100%; background: var(--accent); transition: width .3s }
    #lang { position: absolute; top: 10px; right: 10px; z-index: 15; display: flex; gap: 4px }
    #lang button { padding: 4px 9px; font-size: .72rem }
    #loading { position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; transition: opacity .45s }
    #loading.hidden { opacity: 0; pointer-events: none }
    #loading .bar { width: 200px; height: 3px; background: #21262d; border-radius: 2px; margin-top: 14px; overflow: hidden }
    #loading .fill { height: 100%; background: var(--accent); width: 0%; transition: width .2s }
    .note { font-size: .68rem; color: var(--muted); line-height: 1.4; margin-top: 7px }
  </style>
</head>
<body>
  <div id="loading">
    <div style="font-size:1.5rem;font-weight:700">🚤 JETBOAT</div>
    <div style="color:var(--muted);margin-top:6px;font-size:.85rem" id="load-text">Chargement…</div>
    <div class="bar"><div class="fill" id="load-fill"></div></div>
  </div>
  <div id="canvas-wrap"></div>

  <button id="ui-toggle" title="Panneau (P)" aria-controls="ui" aria-expanded="true"><span class="arr">‹</span></button>

  <div id="ui">
    <header>
      <h1>🚤 JETBOAT</h1>
      <p>RC Mini Jet Boat · jtronics</p>
    </header>

    <div class="section">
      <h2 data-i18n="h-montage">Montage</h2>
      <div class="btn-row">
        <button id="btn-assemble" class="primary" data-i18n="b-assemble">Assembler</button>
        <button id="btn-disassemble" data-i18n="b-disassemble">Démonter</button>
      </div>
      <h2 style="margin-top:11px"><span data-i18n="h-progress">Progression</span> <span id="asm-val">0%</span></h2>
      <input type="range" id="asm-slider" min="0" max="100" value="0"/>
      <div class="btn-row" style="margin-top:9px">
        <button id="btn-guide" class="primary" data-i18n="b-guide">Guide pas-à-pas</button>
      </div>
    </div>

    <div class="section">
      <h2><span data-i18n="h-explode">Éclatement</span> <span id="explode-val">0%</span></h2>
      <input type="range" id="explode-slider" min="0" max="100" value="0"/>
      <div class="note" data-i18n="n-explode">Écarte les pièces depuis le bateau monté.</div>
    </div>

    <div class="section">
      <h2><span data-i18n="h-parts">Pièces</span> <span id="parts-count"></span></h2>
      <div class="btn-row" style="margin-bottom:7px">
        <button id="btn-show-all" style="font-size:.7rem" data-i18n="b-all">Tout</button>
        <button id="btn-hide-all" style="font-size:.7rem" data-i18n="b-none">Masquer</button>
        <button id="btn-fit" style="font-size:.7rem" data-i18n="b-fit">Recadrer</button>
      </div>
      <div id="parts-list"></div>
    </div>

    <div class="section">
      <h2 data-i18n="h-display">Affichage</h2>
      <label class="chk"><input type="checkbox" id="chk-wire"/> <span data-i18n="c-wire">Filaire</span></label>
      <label class="chk"><input type="checkbox" id="chk-auto"/> <span data-i18n="c-auto">Auto-rotation</span></label>
      <label class="chk"><input type="checkbox" id="chk-grid" checked/> <span data-i18n="c-grid">Plan de travail</span></label>
      <label class="chk"><input type="checkbox" id="chk-spin" checked/> <span data-i18n="c-spin">Hélice animée</span></label>
    </div>
  </div>

  <div id="phase"></div>

  <div id="card">
    <div class="bar">
      <button id="st-prev" title="←">◀</button>
      <span class="num" id="st-num"></span>
      <span class="ttl" id="st-title"></span>
      <button id="st-next" title="→">▶</button>
      <button id="st-quit" title="Esc">✕</button>
    </div>
    <div class="body">
      <p id="st-desc"></p>
      <div class="bom" id="st-bom"></div>
      <div class="tip"><b id="st-tiplabel"></b> <span id="st-tip"></span></div>
    </div>
    <div class="prog"><i id="st-prog"></i></div>
  </div>

  <div id="lang">
    <button id="btn-fr" class="active">FR</button>
    <button id="btn-en">EN</button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { STLLoader } from 'three/addons/loaders/STLLoader.js';

    /* ------------------------------------------------------------------ *
     *  REPÈRE
     *  Tout est décrit dans le repère de boat_hull.STL (mm) :
     *    X = travers (0 bâbord … 94 tribord, axe du bateau à X = 47)
     *    Y = hauteur (quille ≈ 3.8, pont ≈ 39.6)
     *    Z = longueur (tableau arrière à 0.05, étrave à 200)
     *  G recentre l'ensemble : origine au milieu de la coque, quille à Y = 0.
     * ------------------------------------------------------------------ */
    const G = new THREE.Vector3(-47, -3.79, -100);

    /* Repères relevés dans les maillages et réutilisés ci-dessous :
         tableau arrière plan ....................... Z = 0.054
         axe du jet ................................. X = 47, Y = 18.9
         rotule du stator ........................... Z = -13.29
         portée du couvercle (haut des bossages) .... Y = 39.6
         tablette du support RC ..................... Y = 29.4
         tablette du servo .......................... Y = 31.57
         perçages moteur (entraxe 16) ............... X = 39 / 55, Z = 106
         chambre à graisse de l'arbre ............... Z = 58 … 76, Ø 2.78
         sièges de paliers Ø5 ....................... Z ≈ 56 et 77            */

    const T = {
      fr: {
        'h-montage':'Montage','b-assemble':'Assembler','b-disassemble':'Démonter',
        'h-progress':'Progression','h-explode':'Éclatement','h-parts':'Pièces',
        'b-all':'Tout','b-none':'Masquer','b-fit':'Recadrer','h-display':'Affichage',
        'c-wire':'Filaire','c-auto':'Auto-rotation','c-grid':'Plan de travail','c-spin':'Hélice animée',
        'n-explode':'Écarte les pièces depuis le bateau monté.',
        'g-print':'Pièces imprimées','g-drive':'Transmission','g-elec':'Électronique',
        'g-fix':'Visserie & joints','g-case':'Boîte de rangement',
        'h-guide':'Guide de montage','b-guide':'Guide pas-à-pas','b-quit':'Quitter le guide',
        'g-step':'Étape','g-of':'sur','g-bom':'Pièces de l’étape','g-tip':'À surveiller',
        'ph-flat':'Pièces à plat','ph-done':'Bateau monté',
        'ui-hide':'Masquer le panneau (P)','ui-show':'Afficher le panneau (P)'
      },
      en: {
        'h-montage':'Assembly','b-assemble':'Assemble','b-disassemble':'Take apart',
        'h-progress':'Progress','h-explode':'Explode','h-parts':'Parts',
        'b-all':'All','b-none':'Hide','b-fit':'Re-frame','h-display':'Display',
        'c-wire':'Wireframe','c-auto':'Auto-rotate','c-grid':'Workbench','c-spin':'Spin impeller',
        'n-explode':'Spreads the parts out from the assembled boat.',
        'g-print':'Printed parts','g-drive':'Drivetrain','g-elec':'Electronics',
        'g-fix':'Fasteners & seals','g-case':'Storage case',
        'h-guide':'Build guide','b-guide':'Step-by-step','b-quit':'Leave guide',
        'g-step':'Step','g-of':'of','g-bom':'Parts for this step','g-tip':'Watch out',
        'ph-flat':'Parts laid out','ph-done':'Boat assembled',
        'ui-hide':'Hide panel (P)','ui-show':'Show panel (P)'
      }
    };
    let lang = 'fr';
    const t = k => (T[lang][k] ?? k);

    /* ------------------------------------------------------------------ *
     *  GÉOMÉTRIES PARAMÉTRIQUES (quincaillerie & électronique)
     *  Convention : construites autour de +Y, origine au point d'appui.
     * ------------------------------------------------------------------ */
    const cyl = (d, h, seg = 20) => new THREE.CylinderGeometry(d / 2, d / 2, h, seg);
    const cylX = (d, h, seg = 16) => cyl(d, h, seg).rotateZ(Math.PI / 2);
    const cylZ = (d, h, seg = 16) => cyl(d, h, seg).rotateX(Math.PI / 2);
    const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
    const at = (g, x, y, z) => { g.translate(x, y, z); return g; };

    // vis à tête cylindrique : origine sous la tête, tige vers -Y
    function screwGeo(len, shaftD = 2, headD = null, headH = null) {
      const hd = headD ?? shaftD * 1.9, hh = headH ?? shaftD * 0.8;
      return [at(cyl(hd, hh), 0, hh / 2, 0), at(cyl(shaftD, len), 0, -len / 2, 0)];
    }
    // vis sans tête : origine à l'entrée du trou, corps vers -Y
    const grubGeo = (len = 3) => [at(cyl(2, len, 14), 0, -len / 2, 0)];
    // insert laiton chauffant M2x3 : origine sur le dessus du bossage
    const insertGeo = () => [at(cyl(3.2, 3, 18), 0, -1.5, 0), at(cyl(3.6, .5, 18), 0, -.25, 0)];
    // tube (palier, entretoise) : origine au centre
    const tubeGeo = (od, len) => [cyl(od, len, 18)];

    function batteryGeo() {                       // 18650 : Ø18.6 × 65
      return [cyl(18.6, 65, 26), at(cyl(8, 1.6, 16), 0, 33.3, 0), at(cyl(17, .8, 26), 0, -32.9, 0)];
    }
    function motorGeo() {                         // DYS BE1806 : Ø23 × 18, origine = face d'appui
      return [at(cyl(23, 13, 26), 0, 11.5, 0), at(cyl(20, 4, 26), 0, 3, 0),
              at(box(19, 1.2, 5), 0, .6, 0), at(box(5, 1.2, 19), 0, .6, 0)];
    }
    /* GOTECK GS-2502 « Nano servo » : 16.0 × 8.0 × 20.0 mm, 2.2 g.
       Couché sur le flanc, comme sur la photo de montage : la longueur (16)
       dans la longueur du bateau, la hauteur (20) en travers, l'épaisseur (8)
       à la verticale. Debout, ses 20 mm ne tiennent pas dans les 12.9 mm que
       laisse le capot plat au-dessus des plots.
       Les languettes d'origine sont coupées — c'est ce qui permet au boîtier
       de descendre entre les plots — et les deux vis M2×6 ne le vissent pas :
       elles l'encadrent à 0.75 mm devant et derrière et le calent. Forme
       d'origine conservée pour le reste : boîtier, moyeu de sortie, corne.
       Origine = dessus des plots.                                          */
    function servoGeo() {
      return [at(box(20, 8, 16), 0, 4, 0),              // boîtier posé sur les plots
              at(box(20, 1.2, 3), 0, 7.4, 6.6),         // capot supérieur du boîtier
              at(cylX(5, 2.5), -11.2, 4, -4),           // moyeu de sortie, vers bâbord
              at(cylX(8, 1.2), -12.8, 4, -4),           // corne
              at(cylZ(1.2, 26), -3, 2.5, -21)];         // faisceau
    }
    function couplerGeo() { return [cyl(6, 12, 20), at(cyl(6.6, 1, 20), 0, 4, 0), at(cyl(6.6, 1, 20), 0, -4, 0)]; }
    const escGeo = () => [box(12, 4.5, 25), at(box(9, 2, 6), 0, 2.6, -14)];
    const becGeo = () => [at(box(11.5, 8.5, 17.5), 0, 4.25, 0)];   // couché : le capot plat ne laisse pas 17.5 mm
    // antenne couchée : dressée, elle traversait le capot plat
    const rxGeo  = () => [box(13, 4, 22), at(cylZ(1, 26), 5, 0, -24)];

    /* Couplage 2S des accus. Une barrette droite d'un accu à l'autre passerait
       en plein dans le tunnel du jet : la liaison série est donc une barrette
       soudée sur chaque pôle, reliée par un fil qui enjambe le tunnel.       */
    const tabGeo = () => [box(9, 8, 0.5), at(cylZ(4, 1.2), 0, 0, .6)];   // barrette + point de soudure
    const cellLinkGeo = () => [
      // liaison série, à l'arrière, dans le jeu laissé devant la butée
      // liaison série, à l'avant, en passant sous la traverse de la platine
      ...pathGeo([[25.9,22.7,105.8],[29,25.5,104.5],[38,26.5,103.5],[47,27,103.5],[56,26.5,103.5],[65,25.5,104.5],[68.1,22.7,105.8]], .8),
      // fils de sortie, à l'arrière, vers l'ESC
      ...pathGeo([[25.9,22.7,36.8],[28,26,42],[35,31,52],[43,35.5,62]], .8),
      ...pathGeo([[68.1,22.7,36.8],[66,26,42],[58,31,52],[51,35.5,62]], .8)
    ].flat();

    // câble / cordon : polyligne (repère coque) → tube
    function pathGeo(pts, r, closed = false, seg = null) {
      const c = new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(...p)), closed, 'catmullrom', .3);
      return [new THREE.TubeGeometry(c, seg ?? Math.max(24, pts.length * 3), r, 10, closed)];
    }

    /* Contour du cordon de mousse, exprimé dans le repère du capot : le joint
       reçoit donc la même pose que lui et suit son inclinaison. Z = 0.84,
       soit 0.9 mm sous la portée — le cordon Ø2 écrasé dans la feuillure.
       Tracé rentré de 6.0 mm sous le nu de la portée : à 2.4 mm il passait
       en plein sur les 4 vis M2 du capot (0.3 mm des axes) et son axe était
       0.94 mm dans la matière du rebord. À 6.0 mm il repose exactement sur
       le fond de feuillure (écart mesuré 0.00 à 0.06 mm sur 144 points) et
       laisse 3.87 mm entre son axe et l'axe des vis, soit 0.5 mm entre le
       cordon et le lamage Ø4.7. Périmètre 273 mm.                          */
    const SEAL_XY = [[36.39,12.71],[32.91,14.22],[29.59,16.06],[26.47,18.21],[23.56,20.65],[20.91,23.36],[18.53,26.32],[16.45,29.49],[14.68,32.85],[13.25,36.36],[12.16,40.0],[11.43,43.72],[11.06,47.5],[11.01,51.29],[11.01,55.09],[11.01,58.88],[11.01,62.68],[11.01,66.47],[11.01,70.27],[11.01,74.07],[11.01,77.86],[11.01,81.66],[11.01,85.45],[11.01,89.25],[11.01,93.05],[11.01,96.84],[11.01,100.64],[11.01,104.43],[11.01,108.23],[11.59,111.95],[13.92,114.89],[17.42,116.24],[21.21,116.28],[25.01,116.28],[28.81,116.28],[32.6,116.28],[36.4,116.28],[40.19,116.28],[43.99,116.28],[47.79,116.28],[51.58,116.28],[55.38,116.24],[58.87,114.88],[61.2,111.94],[61.78,108.23],[61.78,104.43],[61.78,100.63],[61.78,96.84],[61.78,93.04],[61.78,89.25],[61.78,85.45],[61.78,81.65],[61.78,77.86],[61.78,74.06],[61.78,70.27],[61.78,66.47],[61.78,62.67],[61.78,58.88],[61.78,55.08],[61.78,51.29],[61.73,47.49],[61.36,43.72],[60.63,39.99],[59.54,36.36],[58.11,32.84],[56.35,29.48],[54.26,26.31],[51.88,23.36],[49.23,20.64],[46.32,18.21],[43.19,16.06],[39.88,14.21]];
    const sealGeo = () => pathGeo(SEAL_XY.map(([x, y]) => [x, y, 0.84]), 1, true, 260);

    const wireGeo = () => [
      ...pathGeo([[47,37.5,88],[45,30,98],[46,23,104],[47,21,106]], .7),
      ...pathGeo([[33,34,58],[38,35,54],[44,36,50],[46,36.5,45]], .7)
    ].flat();

    const R2 = Math.PI / 2;
    // Inclinaison de la portée du capot : 2.90° nez en l'air (bossages avant
    // 4.46 mm plus haut que les arrière, sur 88.2 mm d'entraxe).
    const SLOPE = Math.atan2(44.26 - 39.80, 88.2);      // 0.050525 rad
    const TILT  = -R2 - SLOPE;

    /* ------------------------------------------------------------------ *
     *  NOMENCLATURE — chaque entrée = une ligne d'inventaire,
     *  `at` liste les positions de montage (repère coque).
     * ------------------------------------------------------------------ */
    const PARTS = [
      /* --- pièces imprimées --------------------------------------------- */

             en:'Head-to-tail, or the series link cannot be made: one cell’s + must face the other’s −. And not hard against the stop — the remaining gap takes the soldered tabs.'} },

      { parts:['cell_tabs','cell_link'], az:206, el:34, pad:1.45,
        t:{fr:'Couplage soudé des accus',en:'Soldered cell coupling'},
        d:{fr:'Une barrette de nickel sur chaque pôle. À l’arrière, les deux barrettes sont reliées par un fil qui enjambe le tunnel du jet : c’est la liaison série, 2S, 7.4 V. À l’avant, les deux fils de sortie partent vers l’ESC.',

             en:'Never dwell on a cell with heat: spot welder if you have one, otherwise a hot iron, flux, under two seconds per terminal. A straight strip from cell to cell would run right through the jet tunnel — hence the wire arching over it.'} },

      { parts:['esc','bec','rx','wires'], az:140, el:54, pad:1.25,
        t:{fr:'Électronique',en:'Electronics'},
        d:{fr:'ESC, BEC et récepteur prennent place sur la platine et dans la bande centrale, seule zone où le capot plat laisse de la hauteur. Le récepteur se pose sur l’accu bâbord, antenne couchée.',
           en:'ESC, BEC and receiver sit on the tray in the central band, the only area where the flat cover leaves any height. The receiver rests on the port cell, antenna laid flat.'},
        tip:{fr:'Position des accus et du servo relevée sur la coque ; celle de l’ESC, du BEC et du récepteur reste indicative. Le BEC est couché : debout, il traverserait le capot.',
             en:'Cell and servo positions are measured on the hull; ESC, BEC and receiver placement is indicative. The BEC lies flat — upright it would go through the cover.'} },

      { parts:['seal','cover','m2x6_cover'], az:160, el:50, pad:1.2,
        t:{fr:'Étanchéité et capot',en:'Seal and canopy'},
        d:{fr:'Poser le cordon mousse Ø2 au fond de la feuillure (≈ 273 mm de contour), bien en retrait des quatre vis, puis le capot, serré par quatre vis M2×6 dans les inserts.',
           en:'Lay the Ø2 foam cord in the rebate (about 273 mm around), well inboard of the four screws, then the canopy, held by four M2×6 screws into the inserts.'},
        tip:{fr:'Serrer en croix et sans forcer : le joint doit être comprimé régulièrement, pas écrasé sur un seul bord.',
             en:'Tighten crosswise and gently: the cord should be evenly compressed, not crushed on one edge.'} },

      { parts:['case_base'], az:135, el:42, pad:1.1,
        t:{fr:'Bac de rangement',en:'Storage tray'},
        d:{fr:'Le bac reçoit le bateau sur trois berceaux découpés d’après les sections réelles de la coque. Le compartiment latéral, cloisonné en trois, prend les accessoires.',
           en:'The tray takes the boat on three cradles cut from the hull’s real sections. The side compartment, split in three, holds the accessories.'},
        tip:{fr:'250 × 132 mm d’emprise : sur un plateau 220 × 220, imprimer en diagonale. Parois 3.2 mm, aucun support.',
             en:'250 × 132 mm footprint: on a 220 × 220 bed, print it diagonally. 3.2 mm walls, no supports.'} },

      { parts:['case_lid','m3x20'], az:130, el:38, pad:1.1,
        t:{fr:'Fermeture',en:'Closing up'},
        d:{fr:'Le couvercle s’emboîte par sa jupe de 8 mm et se serre par quatre vis M3×20 dans les angles. Patins et empreintes permettent de gerber les boîtes.',
           en:'The lid engages with its 8 mm skirt and is clamped by four M3×20 screws at the corners. Feet and recesses let the cases stack.'},
        tip:{fr:'S’imprime retourné, dessus sur le plateau : le cartouche d’étiquette et les lamages sortent nets, sans support.',
             en:'Print it upside down, top face on the bed: the label panel and counterbores come out clean, support-free.'} }
    ];

    /* ------------------------------------------------------------------ */
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d1117);
    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.5, 4000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.5;
    document.getElementById('canvas-wrap').appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    scene.add(new THREE.AmbientLight(0xffffff, .5));
    scene.add(new THREE.HemisphereLight(0xe0f0ff, 0x3a3a3a, 1.35));
    const d1 = new THREE.DirectionalLight(0xffffff, 2.3); d1.position.set(120, 180, 90); scene.add(d1);
    const d2 = new THREE.DirectionalLight(0xaaccff, 1.1); d2.position.set(-90, 70, -120); scene.add(d2);

    let grid = null;
    function setGrid(size) {
      if (grid) { scene.remove(grid); grid.geometry.dispose(); grid.material.dispose(); }
      grid = new THREE.GridHelper(size, Math.round(size / 25), 0x39424d, 0x232a32);
      grid.position.y = -0.05;
      grid.visible = document.getElementById('chk-grid').checked;
      scene.add(grid);
    }
    setGrid(400);

    const loader = new STLLoader();
    let loadedCount = 0;
    const items = [];      // une entrée par exemplaire

    function buildGeos(part) {
      return new Promise(resolve => {
        if (!part.file) { resolve(part.geo()); return; }
        loader.load(part.file, geo => {
          geo.computeVertexNormals();
          // Les STL gardent leur repère d'origine (aucun geo.center()) : pos[] les
          // place sur leurs portées réelles. Seule exception, une pièce tournante
          // doit avoir son axe sur l'origine du maillage, sinon elle décrit un
          // cercle au lieu de tourner sur elle-même.
          if (part.pivot) geo.translate(-part.pivot[0], -part.pivot[1], -part.pivot[2]);
          resolve([geo]);
        }, undefined, () => resolve([box(1, 1, 1)]));
      });
    }

    async function loadAll() {
      for (const part of PARTS) {
        const geos = await buildGeos(part);
        part.mat = new THREE.MeshLambertMaterial({ color: part.color, side: THREE.DoubleSide });
        part.objs = [];
        part.at.forEach(inst => {
          const o = new THREE.Group();
          geos.forEach(g => o.add(new THREE.Mesh(g, part.mat)));
          scene.add(o);
          part.objs.push(o);
          items.push({
            part, obj: o,
            asmPos: new THREE.Vector3(...inst.pos).add(G),
            asmQuat: new THREE.Quaternion().setFromEuler(new THREE.Euler(...(inst.rot ?? [0, 0, 0]))),
            layPos: new THREE.Vector3(), layQuat: new THREE.Quaternion(), lift: 0, t0: 0, t1: 1
          });
        });
        loadedCount++;
        document.getElementById('load-fill').style.width = (loadedCount / PARTS.length * 100) + '%';
      }
      layout();
      timeline();
      buildList();
      apply();
      fitCamera(true);
      document.getElementById('loading').classList.add('hidden');
    }

    /* --- disposition à plat : rangées de pièces posées sur le plan ------- */
    function layout() {
      const ROW_W = 330, GAP = 8;
      let cx = -ROW_W / 2, cz = 0, rowD = 0;
      const bb = new THREE.Box3(), sz = new THREE.Vector3(), ctr = new THREE.Vector3();
      for (const part of PARTS) {
        const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(
          part.lay === 'flat' ? R2 : part.lay === 'flip' ? -R2 : 0, 0, 0));
        part.objs.forEach(o => {
          o.quaternion.copy(q); o.position.set(0, 0, 0); o.updateMatrixWorld(true);
          bb.setFromObject(o); bb.getSize(sz); bb.getCenter(ctr);
          if (cx + sz.x > ROW_W / 2) { cx = -ROW_W / 2; cz += rowD + GAP * 2.4; rowD = 0; }
          const it = items.find(i => i.obj === o);
          it.layQuat.copy(q);
          it.layPos.set(cx + sz.x / 2 - ctr.x, -bb.min.y, cz + sz.z / 2 - ctr.z);
          cx += sz.x + GAP;
          rowD = Math.max(rowD, sz.z);
        });
      }
      // recentre la table de montage
      const zc = (cz + rowD) / 2;
      items.forEach(i => i.layPos.z -= zc);
      // le plan de travail épouse la table de montage (emprise réelle des pièces)
      const span = new THREE.Box3(), ib = new THREE.Box3();
      items.forEach(i => {
        i.obj.position.copy(i.layPos); i.obj.quaternion.copy(i.layQuat);
        i.obj.updateMatrixWorld(true);
        span.union(ib.setFromObject(i.obj));
      });
      setGrid(Math.ceil(Math.max(span.max.x - span.min.x, span.max.z - span.min.z) / 25 + 2) * 25);
    }

    /* --- fenêtre temporelle : un créneau par pièce, exemplaires décalés ---
       Découper par exemplaire donnerait 45 des 54 créneaux à la visserie ;
       chaque ligne de nomenclature reçoit donc une part égale du temps.   */
    function timeline() {
      const N = PARTS.length, SLOT = 0.20;
      let k = 0;
      PARTS.forEach((part, i) => {
        const base = (i / N) * (1 - SLOT);
        part.objs.forEach((o, j) => {
          const it = items.find(x => x.obj === o);
          it.t0 = base + (part.objs.length > 1 ? j / part.objs.length * SLOT * 0.45 : 0);
          it.t1 = it.t0 + SLOT * 0.55;
          it.lift = 12 + 26 * Math.abs(Math.sin(k++ * 2.399));
        });
      });
    }

    /* ------------------------------------------------------------------ */
    let asm = 0, explodeAmount = 0, target = null, spinAngle = 0;
    const smooth = u => u * u * (3 - 2 * u);
    const tmpV = new THREE.Vector3();

    function apply() {
      for (const it of items) {
        const u = smooth(THREE.MathUtils.clamp((asm - it.t0) / (it.t1 - it.t0), 0, 1));
        it.obj.position.lerpVectors(it.layPos, it.asmPos, u);
        it.obj.position.y += it.lift * Math.sin(Math.PI * u);
        it.obj.quaternion.slerpQuaternions(it.layQuat, it.asmQuat, u);
        if (explodeAmount > 0 && u > 0.999) {
          const e = it.part.explode;
          if (e) tmpV.set(e[0], e[1], e[2]);
          else tmpV.copy(it.asmPos).normalize().multiplyScalar(46);
          it.obj.position.addScaledVector(tmpV, explodeAmount / 100);
        }
      }
    }

    /* --- animation ------------------------------------------------------ */
    function goTo(v) { target = v; }
    function stepAnim(dt) {
      if (target === null) return;
      const dir = Math.sign(target - asm);
      asm = THREE.MathUtils.clamp(asm + dir * dt / 3.4, 0, 1);
      if ((dir > 0 && asm >= target) || (dir < 0 && asm <= target)) {
        asm = target; target = null;
        if (!guide) fitCamera();
      }
      setAsm(asm, false);
    }

    function setAsm(v, stop = true) {
      asm = THREE.MathUtils.clamp(v, 0, 1);
      if (stop) target = null;
      document.getElementById('asm-slider').value = Math.round(asm * 100);
      document.getElementById('asm-val').textContent = Math.round(asm * 100) + '%';
      apply();
      showPhase();
      if (!guide && stop && (asm <= 0.001 || asm >= 0.999)) fitCamera();
    }

    const phaseEl = document.getElementById('phase');
    function showPhase() {
      let label = null;
      if (asm <= 0.001) label = t('ph-flat');
      else if (asm >= 0.999) label = t('ph-done');
      else {
        const moving = items.filter(i => asm > i.t0 && asm < i.t1);
        const p = (moving.length ? moving[moving.length - 1] : items[0]).part;
        label = p.name[lang];
      }
      phaseEl.textContent = label;
      phaseEl.classList.add('on');
      clearTimeout(showPhase.tid);
      showPhase.tid = setTimeout(() => phaseEl.classList.remove('on'), 1600);
    }

    /* --- cadrage -------------------------------------------------------- */
    let camGoal = null;
    const DEF_DIR = new THREE.Vector3(0.78, 0.46, -0.72).normalize();

    function fitCamera(instant = false) {
      const bb = new THREE.Box3();
      items.forEach(i => { if (i.obj.visible) bb.expandByObject(i.obj); });
      frame(bb, DEF_DIR, 1.1, instant);
    }
    // az = azimut en degrés (0 = vu de la proue, 180 = vu de la poupe), el = élévation
    const dirOf = (az, el) => {
      const a = THREE.MathUtils.degToRad(az), e = THREE.MathUtils.degToRad(el);
      return new THREE.Vector3(Math.sin(a) * Math.cos(e), Math.sin(e), Math.cos(a) * Math.cos(e)).normalize();
    };

    function frame(bb, dir, pad = 1.1, instant = false) {
      if (bb.isEmpty()) return;
      const c = bb.getCenter(new THREE.Vector3());
      const tv = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2), th = tv * camera.aspect;
      const right = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0, 1, 0)).normalize();
      const up = new THREE.Vector3().crossVectors(right, dir).normalize();
      const p = new THREE.Vector3();
      let dist = 0;
      for (let i = 0; i < 8; i++) {
        p.set(i & 1 ? bb.max.x : bb.min.x, i & 2 ? bb.max.y : bb.min.y, i & 4 ? bb.max.z : bb.min.z).sub(c);
        const depth = p.dot(dir);
        dist = Math.max(dist, depth + Math.abs(p.dot(right)) / th, depth + Math.abs(p.dot(up)) / tv);
      }
      const pos = c.clone().addScaledVector(dir, dist * pad);
      if (instant) { controls.target.copy(c); camera.position.copy(pos); controls.update(); camGoal = null; }
      else camGoal = { c, pos };
    }
    function stepCam(dt) {
      if (!camGoal) return;
      const k = 1 - Math.pow(0.002, dt);
      controls.target.lerp(camGoal.c, k);
      camera.position.lerp(camGoal.pos, k);
      if (camera.position.distanceTo(camGoal.pos) < 0.4) camGoal = null;
    }

    /* --- inventaire ----------------------------------------------------- */
    const GROUPS = ['g-print', 'g-drive', 'g-elec', 'g-fix', 'g-case'];
    function buildList() {
      const list = document.getElementById('parts-list');
      list.innerHTML = '';
      let n = 0;
      PARTS.forEach(p => { if (p.optional) p.objs.forEach(o => o.visible = false); });
      for (const grp of GROUPS) {
        const h = document.createElement('div');
        h.className = 'grp-title'; h.dataset.grp = grp; h.textContent = t(grp);
        list.appendChild(h);
        for (const part of PARTS.filter(p => p.grp === grp)) {
          n += part.at.length;
          const lab = document.createElement('label');
          lab.className = 'chk';
          lab.innerHTML = `<input type="checkbox"${part.optional ? '' : ' checked'}>
            <span class="sw" style="background:#${part.color.toString(16).padStart(6, '0')}"></span>
            <span class="nm"></span><span class="qty">×${part.at.length}</span>`;
          const nm = lab.querySelector('.nm');
          nm.textContent = part.name[lang];
          nm.dataset.part = part.id;
          lab.querySelector('input').onchange = e => {
            part.objs.forEach(o => o.visible = e.target.checked);
          };
          list.appendChild(lab);
        }
      }
      document.getElementById('parts-count').textContent = `${n}`;
    }

    function setLang(l) {
      lang = l;
      document.getElementById('btn-fr').classList.toggle('active', l === 'fr');
      document.getElementById('btn-en').classList.toggle('active', l === 'en');
      document.querySelectorAll('[data-i18n]').forEach(e => e.textContent = t(e.dataset.i18n));
      document.querySelectorAll('.grp-title').forEach(e => e.textContent = t(e.dataset.grp));
      document.querySelectorAll('#parts-list .nm').forEach(e =>
        e.textContent = PARTS.find(p => p.id === e.dataset.part).name[lang]);
      const off = document.body.classList.contains('ui-off');
      document.getElementById('ui-toggle').title = t(off ? 'ui-show' : 'ui-hide');
      document.getElementById('btn-guide').textContent = t(guide ? 'b-quit' : 'b-guide');
      if (guide) renderCard();
      showPhase();
    }

    /* ------------------------------------------------------------------ *
     *  GUIDE : chaque étape amène le montage jusqu'à ses pièces, masque
     *  celles qui viennent après, met en valeur celles de l'étape et place
     *  la caméra sous l'angle qui les montre.
     * ------------------------------------------------------------------ */
    let guide = false, step = 0;
    const stepOf = new Map();          // part.id -> index d'étape
    STEPS.forEach((s, i) => s.parts.forEach(id => stepOf.set(id, i)));

    function stepEnd(i) {              // avancement d'assemblage en fin d'étape
      let e = 0;
      for (const it of items) if (stepOf.get(it.part.id) <= i) e = Math.max(e, it.t1);
      return e;
    }

    function stepBox(i) {              // emprise des pièces de l'étape, une fois montées
      const bb = new THREE.Box3(), one = new THREE.Box3();
      const p = new THREE.Vector3(), q = new THREE.Quaternion();
      for (const it of items) {
        if (stepOf.get(it.part.id) !== i) continue;
        // les pièces sont peut-être encore en vol : on mesure la pose montée
        p.copy(it.obj.position); q.copy(it.obj.quaternion);
        it.obj.position.copy(it.asmPos); it.obj.quaternion.copy(it.asmQuat);
        it.obj.updateMatrixWorld(true);
        bb.union(one.setFromObject(it.obj));
        it.obj.position.copy(p); it.obj.quaternion.copy(q);
        it.obj.updateMatrixWorld(true);
      }
      if (bb.isEmpty()) return bb;
      const sz = bb.getSize(new THREE.Vector3()), c = bb.getCenter(new THREE.Vector3());
      const m = 40;                    // une vis seule ne doit pas coller la caméra au nez
      bb.setFromCenterAndSize(c, sz.max(new THREE.Vector3(m, m, m)));
      return bb;
    }

    function showStep(i, instant = false) {
      step = THREE.MathUtils.clamp(i, 0, STEPS.length - 1);
      const s = STEPS[step];
      // visibilité : tout ce qui est déjà monté, rien de ce qui suit
      PARTS.forEach(p => {
        const vis = stepOf.get(p.id) <= step;
        p.objs.forEach(o => o.visible = vis);
        p.mat.emissive.setHex(stepOf.get(p.id) === step ? 0x40210a : 0x000000);
      });
      document.querySelectorAll('#parts-list input').forEach((inp, k) => {
        const p = PARTS.find(x => x.id === inp.closest('label').querySelector('.nm').dataset.part);
        inp.checked = stepOf.get(p.id) <= step;
      });
      goTo(stepEnd(step));
      frame(stepBox(step), dirOf(s.az, s.el), s.pad, instant);
      renderCard();
    }

    function renderCard() {
      const s = STEPS[step];
      document.getElementById('st-num').textContent = `${t('g-step')} ${step + 1} ${t('g-of')} ${STEPS.length}`;
      document.getElementById('st-title').textContent = s.t[lang];
      document.getElementById('st-desc').textContent = s.d[lang];
      document.getElementById('st-tip').textContent = s.tip[lang];
      document.getElementById('st-tiplabel').textContent = t('g-tip') + ' —';
      document.getElementById('st-prog').style.width = ((step + 1) / STEPS.length * 100) + '%';
      const bom = document.getElementById('st-bom');
      bom.innerHTML = '';
      s.parts.forEach(id => {
        const p = PARTS.find(x => x.id === id);
        const e = document.createElement('span');
        e.innerHTML = `<i style="background:#${p.color.toString(16).padStart(6, '0')}"></i>`;
        e.append(`${p.name[lang]} ×${p.at.length}`);
        bom.appendChild(e);
      });
      document.getElementById('st-prev').disabled = step === 0;
      document.getElementById('st-next').disabled = step === STEPS.length - 1;
    }

    function setGuide(on, keep = false) {
      guide = on;
      document.body.classList.toggle('guide', on);
      document.getElementById('btn-guide').textContent = t(on ? 'b-quit' : 'b-guide');
      if (on) { showStep(keep ? step : 0); }
      else {
        PARTS.forEach(p => {
          p.mat.emissive.setHex(0x000000);
          const vis = !p.optional;
          p.objs.forEach(o => o.visible = vis);
        });
        document.querySelectorAll('#parts-list input').forEach(inp => {
          const p = PARTS.find(x => x.id === inp.closest('label').querySelector('.nm').dataset.part);
          inp.checked = !p.optional;
        });
        goTo(1);
      }
    }

    document.getElementById('btn-guide').onclick = () => setGuide(!guide);
    document.getElementById('st-prev').onclick = () => showStep(step - 1);
    document.getElementById('st-next').onclick = () => showStep(step + 1);
    document.getElementById('st-quit').onclick = () => setGuide(false);
    addEventListener('keydown', e => {
      if (!guide || /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
      if (e.key === 'ArrowRight') showStep(step + 1);
      else if (e.key === 'ArrowLeft') showStep(step - 1);
      else if (e.key === 'Escape') setGuide(false);
    });

    /* --- commandes ------------------------------------------------------ */
    document.getElementById('btn-assemble').onclick = () => { if (guide) setGuide(false); goTo(1); };
    document.getElementById('btn-disassemble').onclick = () => { if (guide) setGuide(false); goTo(0); };
    document.getElementById('asm-slider').oninput = e => { if (guide) setGuide(false); setAsm(+e.target.value / 100); };
    document.getElementById('explode-slider').oninput = e => {
      explodeAmount = +e.target.value;
      document.getElementById('explode-val').textContent = explodeAmount + '%';
      if (explodeAmount > 0 && asm < 1) setAsm(1);
      else apply();
    };
    document.getElementById('btn-show-all').onclick = () => setAllVisible(true);
    document.getElementById('btn-hide-all').onclick = () => setAllVisible(false);
    function setAllVisible(v) {
      PARTS.forEach(p => p.objs.forEach(o => o.visible = v));
      document.querySelectorAll('#parts-list input').forEach(i => i.checked = v);
    }
    document.getElementById('btn-fit').onclick = () => fitCamera();
    document.getElementById('chk-wire').onchange = e => PARTS.forEach(p => p.mat.wireframe = e.target.checked);
    document.getElementById('chk-grid').onchange = e => grid.visible = e.target.checked;
    
    let autoRotate = false, spinOn = true;
    document.getElementById('chk-auto').onchange = e => autoRotate = e.target.checked;
    document.getElementById('chk-spin').onchange = e => spinOn = e.target.checked;
    document.getElementById('btn-fr').onclick = () => setLang('fr');
    document.getElementById('btn-en').onclick = () => setLang('en');

    // panneau latéral escamotable — replié d'office sur les petits écrans
    const uiToggle = document.getElementById('ui-toggle');
    function setUI(open) {
      document.body.classList.toggle('ui-off', !open);
      uiToggle.setAttribute('aria-expanded', open);
      uiToggle.title = t(open ? 'ui-hide' : 'ui-show');
    }
    uiToggle.onclick = () => setUI(document.body.classList.contains('ui-off'));
    addEventListener('keydown', e => {
      if (e.key.toLowerCase() === 'p' && !e.metaKey && !e.ctrlKey && !e.altKey
          && !/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) uiToggle.onclick();
    });
    setUI(innerWidth > 720);

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      stepAnim(dt);
      stepCam(dt);
      if (spinOn) {
        spinAngle += dt * 12;
        PARTS.forEach(p => {
          if (!p.spin) return;
          p.at.forEach((inst, k) => {
            const e = inst.rot ?? [0, 0, 0];
            if (asm > 0.999) p.objs[k].rotation.set(e[0], e[1], e[2] + spinAngle);
          });
        });
      }
      controls.autoRotate = autoRotate;
      controls.update();
      renderer.render(scene, camera);
    }

    loadAll().then(animate);
  </script>
</body>
</html>
