<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>JETBOAT — Visualiseur 3D RC Mini Jet Boat</title>
  <meta name="description" content="Visualiseur 3D interactif du RC Mini Jet Boat (jtronics) — assemblage, vue éclatée, build pas-à-pas" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚤</text></svg>" />
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --accent2: #f78166;
      --green: #3fb950;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
    #canvas-wrap { position: absolute; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #ui {
      position: absolute; top: 0; left: 0; bottom: 0; width: 300px;
      background: rgba(22,27,34,0.94); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; backdrop-filter: blur(10px);
      z-index: 10; overflow-y: auto; transition: transform .25s ease;
    }
    #ui.collapsed { transform: translateX(-100%); }
    #ui header { padding: 14px 16px 10px; border-bottom: 1px solid var(--border); }
    #ui header h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.02em; }
    #ui header p { font-size: 0.72rem; color: var(--muted); margin-top: 3px; }
    .section { padding: 10px 14px; border-bottom: 1px solid var(--border); }
    .section h2 { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 8px; }
    .btn-row { display: flex; gap: 5px; flex-wrap: wrap; }
    button, .btn {
      background: #21262d; border: 1px solid var(--border); color: var(--text);
      padding: 6px 10px; border-radius: 6px; font-size: 0.78rem; cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    button:hover, .btn:hover { background: #30363d; border-color: #8b949e; }
    button.active { background: var(--accent); border-color: var(--accent); color: #0d1117; font-weight: 600; }
    button.primary { background: var(--accent2); border-color: var(--accent2); color: #0d1117; font-weight: 600; }
    input[type="range"] { width: 100%; accent-color: var(--accent); height: 4px; }
    label.chk { display: flex; align-items: center; gap: 7px; font-size: 0.8rem; padding: 3px 0; cursor: pointer; }
    label.chk input { accent-color: var(--accent); }
    #parts-list { max-height: 180px; overflow-y: auto; }
    #parts-list label { padding: 2px 0; font-size: 0.78rem; }
    .step-bar {
      position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
      background: rgba(22,27,34,0.96); border: 1px solid var(--border); border-radius: 12px;
      padding: 10px 16px; display: none; align-items: center; gap: 12px; z-index: 20;
      box-shadow: 0 8px 32px rgba(0,0,0,0.45); max-width: 92vw;
    }
    .step-bar.visible { display: flex; }
    .step-bar .info { min-width: 160px; text-align: center; }
    .step-bar .info strong { display: block; font-size: 0.9rem; }
    .step-bar .info span { font-size: 0.72rem; color: var(--muted); }
    #lang { position: absolute; top: 10px; right: 10px; z-index: 15; display: flex; gap: 4px; }
    #lang button { padding: 4px 9px; font-size: 0.72rem; }
    .view-pad {
      position: absolute; bottom: 16px; left: 316px; z-index: 15;
      display: grid; grid-template-columns: repeat(3, 34px); gap: 3px; transition: left .25s;
    }
    #ui.collapsed ~ .view-pad { left: 16px; }
    .view-pad button { width: 34px; height: 34px; padding: 0; font-size: 0.68rem; }
    #loading {
      position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 100; transition: opacity .45s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading .bar { width: 200px; height: 3px; background: #21262d; border-radius: 2px; margin-top: 14px; overflow: hidden; }
    #loading .fill { height: 100%; background: var(--accent); width: 0%; transition: width .2s; }
    #toast {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
      background: #21262d; border: 1px solid var(--border); padding: 7px 14px; border-radius: 8px;
      font-size: 0.82rem; opacity: 0; transition: opacity .3s; z-index: 50; pointer-events: none;
    }
    #toast.show { opacity: 1; }
    #toggle-ui {
      position: absolute; top: 10px; left: 10px; z-index: 20;
      width: 36px; height: 36px; border-radius: 8px; display: none;
      background: rgba(22,27,34,0.9); border: 1px solid var(--border); color: var(--text);
      font-size: 1.1rem; cursor: pointer;
    }
    @media (max-width: 700px) {
      #ui { width: 260px; }
      #toggle-ui { display: block; }
      .view-pad { left: 12px; bottom: 80px; }
      .step-bar { bottom: 12px; }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div style="font-size:1.5rem;font-weight:700;letter-spacing:-0.03em">🚤 JETBOAT</div>
    <div style="color:var(--muted);margin-top:6px;font-size:0.85rem" id="load-text">Chargement des modèles 3D…</div>
    <div class="bar"><div class="fill" id="load-fill"></div></div>
  </div>
  <div id="toast"></div>
  <button id="toggle-ui" title="Menu">☰</button>
  <div id="canvas-wrap"></div>

  <div id="ui">
    <header>
      <h1>🚤 JETBOAT</h1>
      <p>RC Mini Jet Boat · jtronics · Visualiseur 3D</p>
    </header>

    <div class="section">
      <h2 data-i18n="mode">Mode</h2>
      <div class="btn-row">
        <button id="btn-assembled" class="active" data-i18n="assembled">Assemblé</button>
        <button id="btn-exploded" data-i18n="exploded">Éclaté</button>
        <button id="btn-build" class="primary" data-i18n="build">Build pas-à-pas</button>
      </div>
    </div>

    <div class="section" id="explode-section">
      <h2><span data-i18n="explode">Éclatement</span> <span id="explode-val">0%</span></h2>
      <input type="range" id="explode-slider" min="0" max="100" value="0" />
    </div>

    <div class="section">
      <h2 data-i18n="tree">Arbre d'assemblage</h2>
      <div class="btn-row" style="margin-bottom:6px">
        <button id="btn-show-all" style="font-size:0.7rem" data-i18n="showAll">Tout afficher</button>
        <button id="btn-hide-all" style="font-size:0.7rem" data-i18n="hideAll">Tout masquer</button>
      </div>
      <div id="parts-list"></div>
    </div>

    <div class="section">
      <h2 data-i18n="display">Affichage</h2>
      <label class="chk"><input type="checkbox" id="chk-wire" /> <span data-i18n="wire">Mode filaire</span></label>
      <label class="chk"><input type="checkbox" id="chk-auto" /> <span data-i18n="auto">Auto-rotation</span></label>
      <label class="chk"><input type="checkbox" id="chk-edges" /> <span data-i18n="edges">Arêtes</span></label>
      <div style="margin-top:8px">
        <label style="font-size:0.72rem;color:var(--muted)" data-i18n="bg">Fond</label>
        <div class="btn-row" style="margin-top:4px">
          <button data-bg="#0d1117" class="bg-btn active">Sombre</button>
          <button data-bg="#1a2332" class="bg-btn">Bleu</button>
          <button data-bg="#f0f0f0" class="bg-btn">Clair</button>
        </div>
      </div>
    </div>

    <div class="section" style="margin-top:auto;border-bottom:none">
      <h2 data-i18n="info">Infos modèle</h2>
      <p style="font-size:0.75rem;color:var(--muted);line-height:1.45">
        RC Mini Jet Boat · 230 × 75 × 50 mm<br>
        Impression 3D PLA · Jet drive intégré<br>
        Source : <a href="https://cults3d.com/en/users/jtronics/creations" target="_blank" style="color:var(--accent)">jtronics / Cults3D</a>
      </p>
    </div>
  </div>

  <div class="view-pad">
    <button data-view="iso">ISO</button>
    <button data-view="top">↑</button>
    <button data-view="reset">↺</button>
    <button data-view="left">←</button>
    <button data-view="front">●</button>
    <button data-view="right">→</button>
    <span></span>
    <button data-view="bottom">↓</button>
    <span></span>
  </div>

  <div class="step-bar" id="step-bar">
    <button id="step-prev">◀</button>
    <div class="info">
      <strong id="step-title">Étape 1</strong>
      <span id="step-desc">Description</span>
    </div>
    <button id="step-next">▶</button>
  </div>

  <div id="lang">
    <button id="btn-fr" class="active">FR</button>
    <button id="btn-en">EN</button>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { STLLoader } from 'three/addons/loaders/STLLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    // ─── i18n ───────────────────────────────────────────────
    const I18N = {
      fr: {
        mode: 'Mode', assembled: 'Assemblé', exploded: 'Éclaté', build: 'Build pas-à-pas',
        explode: 'Éclatement', tree: "Arbre d'assemblage", showAll: 'Tout afficher', hideAll: 'Tout masquer',
        display: 'Affichage', wire: 'Mode filaire', auto: 'Auto-rotation', edges: 'Arêtes', bg: 'Fond',
        info: 'Infos modèle', load: 'Chargement des modèles 3D…',
        steps: [
          { title: 'Étape 1 — Coque', desc: 'Positionner la coque principale' },
          { title: 'Étape 2 — Stator', desc: 'Insérer le stator du jet drive à l’arrière' },
          { title: 'Étape 3 — Hélice', desc: 'Monter l’hélice dans le stator' },
          { title: 'Étape 4 — Tuyère', desc: 'Fixer la tuyère (nozzle) derrière le stator' },
          { title: 'Étape 5 — Support RC', desc: 'Installer le support électronique / RC' },
          { title: 'Étape 6 — Clevis servo', desc: 'Monter le clevis de liaison servo' },
          { title: 'Étape 7 — Trims', desc: 'Ajouter les trims de direction' },
          { title: 'Étape 8 — Couvercle', desc: 'Refermer avec le couvercle + joint mousse' },
          { title: 'Étape 9 — Complet', desc: 'Assemblage terminé 🚤' },
        ]
      },
      en: {
        mode: 'Mode', assembled: 'Assembled', exploded: 'Exploded', build: 'Step-by-step',
        explode: 'Explode', tree: 'Assembly tree', showAll: 'Show all', hideAll: 'Hide all',
        display: 'Display', wire: 'Wireframe', auto: 'Auto-rotate', edges: 'Edges', bg: 'Background',
        info: 'Model info', load: 'Loading 3D models…',
        steps: [
          { title: 'Step 1 — Hull', desc: 'Place the main hull' },
          { title: 'Step 2 — Stator', desc: 'Insert the jet drive stator at the rear' },
          { title: 'Step 3 — Propeller', desc: 'Mount the propeller inside the stator' },
          { title: 'Step 4 — Nozzle', desc: 'Attach the nozzle behind the stator' },
          { title: 'Step 5 — RC mount', desc: 'Install the electronics / RC mount' },
          { title: 'Step 6 — Servo clevis', desc: 'Mount the servo linkage clevis' },
          { title: 'Step 7 — Trims', desc: 'Add the steering trims' },
          { title: 'Step 8 — Cover', desc: 'Close with the cover + foam seal' },
          { title: 'Step 9 — Complete', desc: 'Assembly finished 🚤' },
        ]
      }
    };
    let lang = 'fr';

    function t(key) { return I18N[lang][key] || key; }
    function applyI18n() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const k = el.getAttribute('data-i18n');
        if (k && I18N[lang] && I18N[lang][k]) el.textContent = I18N[lang][k];
      });
      const explodeVal = document.getElementById('explode-val');
      const explodeSlider = document.getElementById('explode-slider');
      if (explodeVal && explodeSlider) {
        explodeVal.textContent = explodeSlider.value + '%';
      }
      if (typeof updateStepUI === 'function') updateStepUI();
    }

    // Assemblage réel : moteur (jet) DANS le tunnel arrière, couvercle POSÉ sur le pont
    // Hull after center: rear Zc=+124, front Zc=−76, deck Yc=+26.5, tunnel Ø≈37 @ Zc=100–115
    const PARTS = [
      // Coque semi-transparente pour voir le moteur à l'intérieur
      { id: 'hull',     name: {fr:'Coque', en:'Hull'},           file: 'boat_hull.STL',           color: 0x3b82f6, opacity: 0.35,
        pos: [0, 0, 0], rot: [0, 0, 0], explode: [0, -55, 0] },

      // === JET DRIVE emboîté dans le tunnel arrière ===
      { id: 'stator',   name: {fr:'Stator jet', en:'Jet stator'}, file: 'models/jet_stator.STL',   color: 0x6b7280, opacity: 1,
        pos: [0, 6, 105], rot: [0, 0, 0], explode: [0, 35, 75] },
      { id: 'prop',     name: {fr:'Hélice', en:'Propeller'},      file: 'models/jet_propeller.STL', color: 0xf59e0b, opacity: 1,
        pos: [0, 6, 103], rot: [0, 0, 0], explode: [0, 55, 55], spin: true },
      { id: 'nozzle',   name: {fr:'Tuyère', en:'Nozzle'},         file: 'models/jet_nozzle.STL',    color: 0x4b5563, opacity: 1,
        pos: [0, 6, 120], rot: [0, 0, 0], explode: [0, 20, 105] },

      // === COUVERCLE posé sur le pont ===
      { id: 'cover',    name: {fr:'Couvercle', en:'Cover'},       file: 'models/boat_cover.STL',   color: 0x1d4ed8, opacity: 0.9,
        pos: [0, 28, -8], rot: [-Math.PI/2, 0, 0], explode: [0, 90, 0] },

      { id: 'rc',       name: {fr:'Support RC', en:'RC mount'},   file: 'models/rc_mount.STL',     color: 0x16a34a, opacity: 1,
        pos: [0, 10, -15], rot: [-Math.PI/2, 0, 0], explode: [0, 50, -25] },
      { id: 'clevis',   name: {fr:'Clevis servo', en:'Servo clevis'}, file: 'models/servo_clevis.STL', color: 0xca8a04, opacity: 1,
        pos: [16, 8, 115], rot: [0, 0, Math.PI/2], explode: [50, 20, 45] },
      { id: 'trim15',   name: {fr:'Trim 15°', en:'Trim 15°'},     file: 'models/boat_trim_15.STL', color: 0x7c3aed, opacity: 1,
        pos: [-40, -6, 60], rot: [0, 0, 0], explode: [-60, 5, 0] },
      { id: 'trim20',   name: {fr:'Trim 20°', en:'Trim 20°'},     file: 'models/boat_trim_20.STL', color: 0x9333ea, opacity: 1,
        pos: [40, -6, 60], rot: [0, Math.PI, 0], explode: [60, 5, 0] },
    ];

    const BUILD_ORDER = [0, 1, 2, 3, 4, 5, 6, 7, 8];

    // ─── SCENE SETUP ───────────────────────────────────────
    const container = document.getElementById('canvas-wrap');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d1117);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.5, 2000);
    camera.position.set(160, 100, 160);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.6;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    try {
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    } catch (e) { console.warn('PMREM failed', e); }

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 5, 20);
    controls.minDistance = 40;
    controls.maxDistance = 600;

    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    const hemi = new THREE.HemisphereLight(0xe0f0ff, 0x3a3a3a, 1.4);
    scene.add(hemi);
    const dir = new THREE.DirectionalLight(0xffffff, 2.4);
    dir.position.set(100, 150, 80);
    scene.add(dir);
    const dir2 = new THREE.DirectionalLight(0xaaccff, 1.2);
    dir2.position.set(-80, 60, -100);
    scene.add(dir2);
    const dir3 = new THREE.DirectionalLight(0xffeecc, 0.8);
    dir3.position.set(0, 40, 150);
    scene.add(dir3);

    // ─── STATE ──────────────────────────────────────────────
    const meshes = {};
    const basePositions = {};
    const explodeOffsets = {};
    let mode = 'assembled';
    let explodeAmount = 0;
    let currentStep = 0;
    let autoRotate = false;
    let wireframe = false;
    let showEdges = false;

    // ─── LOAD MODELS (STL) ──────────────────────────────────
    const loader = new STLLoader();
    let loaded = 0;
    const total = PARTS.length;

    function updateProgress() {
      const pct = Math.round((loaded / total) * 100);
      const fill = document.getElementById('load-fill');
      const text = document.getElementById('load-text');
      if (fill) fill.style.width = pct + '%';
      if (text) text.textContent = t('load') + ` ${pct}%`;
    }

    function loadPart(part) {
      return new Promise((resolve) => {
        loader.load(part.file, (geometry) => {
          geometry.computeVertexNormals();
          geometry.center();

          const isTransparent = part.opacity < 1;
          const mat = new THREE.MeshLambertMaterial({
            color: part.color,
            transparent: isTransparent,
            opacity: part.opacity,
            depthWrite: !isTransparent,
            side: THREE.DoubleSide,
          });
          const mesh = new THREE.Mesh(geometry, mat);
          mesh.name = part.id;
          mesh.userData.part = part;
          if (isTransparent) mesh.renderOrder = 1;

          mesh.position.set(...part.pos);
          mesh.rotation.set(...part.rot);

          basePositions[part.id] = mesh.position.clone();
          explodeOffsets[part.id] = new THREE.Vector3(...part.explode);

          scene.add(mesh);
          meshes[part.id] = mesh;
          loaded++;
          updateProgress();
          resolve();
        }, undefined, (err) => {
          console.warn('Failed to load', part.file, err);
          loaded++;
          updateProgress();
          resolve();
        });
      });
    }

    async function loadAll() {
      for (const p of PARTS) {
        await loadPart(p);
      }
      const list = document.getElementById('parts-list');
      list.innerHTML = '';
      PARTS.forEach(p => {
        const lab = document.createElement('label');
        lab.className = 'chk';
        lab.innerHTML = `<input type="checkbox" checked data-part="${p.id}"> ${p.name[lang]}`;
        list.appendChild(lab);
      });
      list.querySelectorAll('input').forEach(inp => {
        inp.addEventListener('change', () => {
          const m = meshes[inp.dataset.part];
          if (m) m.visible = inp.checked;
        });
      });

      document.getElementById('loading').classList.add('hidden');
      toast(lang === 'fr' ? 'Modèles chargés ✓' : 'Models loaded ✓');
      fitCamera();
    }

    function setMode(m) {
      mode = m;
      document.getElementById('btn-assembled').classList.toggle('active', m === 'assembled');
      document.getElementById('btn-exploded').classList.toggle('active', m === 'exploded');
      document.getElementById('btn-build').classList.toggle('active', m === 'build');
      document.getElementById('step-bar').classList.toggle('visible', m === 'build');
      document.getElementById('explode-section').style.opacity = m === 'exploded' ? '1' : '0.4';

      if (m === 'assembled') {
        explodeAmount = 0;
        document.getElementById('explode-slider').value = 0;
        document.getElementById('explode-val').textContent = '0%';
        applyTransforms();
        showAllParts(true);
      } else if (m === 'exploded') {
        applyTransforms();
        showAllParts(true);
      } else if (m === 'build') {
        currentStep = 0;
        updateStepUI();
        applyBuildStep();
      }
    }

    function applyTransforms() {
      const t = mode === 'exploded' ? explodeAmount / 100 : 0;
      PARTS.forEach(p => {
        const mesh = meshes[p.id];
        if (!mesh) return;
        const base = basePositions[p.id];
        const off = explodeOffsets[p.id];
        mesh.position.set(
          base.x + off.x * t,
          base.y + off.y * t,
          base.z + off.z * t
        );
      });
    }

    function setEmissive(obj, color, intensity) {
      obj.traverse(c => {
        if (c.isMesh && c.material) {
          c.material.emissive = new THREE.Color(color);
          c.material.emissiveIntensity = intensity;
        }
      });
    }

    function applyBuildStep() {
      PARTS.forEach((p, i) => {
        const mesh = meshes[p.id];
        if (!mesh) return;
        mesh.visible = i <= currentStep;
        setEmissive(mesh, i === currentStep ? 0x2244aa : 0x000000, i === currentStep ? 0.35 : 0);
      });
      document.querySelectorAll('#parts-list input').forEach(inp => {
        const idx = PARTS.findIndex(p => p.id === inp.dataset.part);
        inp.checked = idx <= currentStep;
      });
    }

    function updateStepUI() {
      const s = (I18N[lang] && I18N[lang].steps && I18N[lang].steps[currentStep]) || (I18N[lang] && I18N[lang].steps && I18N[lang].steps[0]);
      if (!s) return;
      const titleEl = document.getElementById('step-title');
      const descEl = document.getElementById('step-desc');
      if (titleEl) titleEl.textContent = s.title;
      if (descEl) descEl.textContent = s.desc;
    }

    function showAllParts(vis) {
      PARTS.forEach(p => {
        const m = meshes[p.id];
        if (m) {
          m.visible = vis;
          setEmissive(m, 0x000000, 0);
        }
      });
      document.querySelectorAll('#parts-list input').forEach(inp => inp.checked = vis);
    }

    function fitCamera() {
      const box = new THREE.Box3();
      Object.values(meshes).forEach(m => { if (m.visible) box.expandByObject(m); });
      if (box.isEmpty()) return;
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      const dist = maxDim * 1.6;
      controls.target.copy(center);
      camera.position.set(center.x + dist * 0.7, center.y + dist * 0.45, center.z + dist * 0.7);
      controls.update();
    }

    function setView(name) {
      const target = controls.target.clone();
      const dist = camera.position.distanceTo(target);
      if (name === 'iso') camera.position.set(target.x + dist * 0.7, target.y + dist * 0.5, target.z + dist * 0.7);
      else if (name === 'top') camera.position.set(target.x, target.y + dist, target.z + 0.01);
      else if (name === 'bottom') camera.position.set(target.x, target.y - dist, target.z + 0.01);
      else if (name === 'front') camera.position.set(target.x, target.y + dist * 0.2, target.z + dist);
      else if (name === 'left') camera.position.set(target.x - dist, target.y + dist * 0.2, target.z);
      else if (name === 'right') camera.position.set(target.x + dist, target.y + dist * 0.2, target.z);
      else if (name === 'reset') fitCamera();
      controls.update();
    }

    document.getElementById('btn-assembled').onclick = () => setMode('assembled');
    document.getElementById('btn-exploded').onclick = () => setMode('exploded');
    document.getElementById('btn-build').onclick = () => setMode('build');

    document.getElementById('explode-slider').oninput = (e) => {
      explodeAmount = +e.target.value;
      document.getElementById('explode-val').textContent = explodeAmount + '%';
      if (mode !== 'exploded') setMode('exploded');
      else applyTransforms();
    };

    document.getElementById('btn-show-all').onclick = () => showAllParts(true);
    document.getElementById('btn-hide-all').onclick = () => showAllParts(false);

    document.getElementById('chk-wire').onchange = (e) => {
      wireframe = e.target.checked;
      Object.values(meshes).forEach(m => {
        m.traverse(c => { if (c.isMesh && c.material) c.material.wireframe = wireframe; });
      });
    };
    document.getElementById('chk-auto').onchange = (e) => { autoRotate = e.target.checked; };
    document.getElementById('chk-edges').onchange = (e) => {
      showEdges = e.target.checked;
      Object.values(meshes).forEach(m => {
        m.traverse(c => {
          if (c.isMesh && c.geometry && !c.userData.isEdge) {
            if (showEdges && !c.userData.edgeLine) {
              const edges = new THREE.EdgesGeometry(c.geometry, 25);
              const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x88aacc, transparent: true, opacity: 0.45 }));
              line.userData.isEdge = true;
              c.add(line);
              c.userData.edgeLine = line;
            }
            if (c.userData.edgeLine) c.userData.edgeLine.visible = showEdges;
          }
        });
      });
    };

    document.querySelectorAll('.bg-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.bg-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const c = btn.dataset.bg;
        scene.background = new THREE.Color(c);
        document.body.style.background = c;
      };
    });

    document.querySelectorAll('.view-pad button').forEach(btn => {
      btn.onclick = () => setView(btn.dataset.view);
    });

    document.getElementById('step-prev').onclick = () => {
      if (currentStep > 0) { currentStep--; updateStepUI(); applyBuildStep(); }
    };
    document.getElementById('step-next').onclick = () => {
      if (currentStep < BUILD_ORDER.length - 1) { currentStep++; updateStepUI(); applyBuildStep(); }
    };

    document.getElementById('btn-fr').onclick = () => {
      lang = 'fr';
      document.getElementById('btn-fr').classList.add('active');
      document.getElementById('btn-en').classList.remove('active');
      applyI18n();
      document.querySelectorAll('#parts-list label').forEach((lab, i) => {
        const inp = lab.querySelector('input');
        lab.innerHTML = ''; lab.appendChild(inp);
        lab.appendChild(document.createTextNode(' ' + PARTS[i].name.fr));
      });
    };
    document.getElementById('btn-en').onclick = () => {
      lang = 'en';
      document.getElementById('btn-en').classList.add('active');
      document.getElementById('btn-fr').classList.remove('active');
      applyI18n();
      document.querySelectorAll('#parts-list label').forEach((lab, i) => {
        const inp = lab.querySelector('input');
        lab.innerHTML = ''; lab.appendChild(inp);
        lab.appendChild(document.createTextNode(' ' + PARTS[i].name.en));
      });
    };

    document.getElementById('toggle-ui').onclick = () => {
      document.getElementById('ui').classList.toggle('collapsed');
    };

    function toast(msg) {
      const el = document.getElementById('toast');
      if (!el) return;
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2200);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ─── ANIMATION LOOP ─────────────────────────────────────
    const _clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = _clock.getDelta();
      const prop = meshes['prop'];
      if (prop && prop.visible) {
        prop.rotation.z += dt * 12;
      }
      controls.autoRotate = autoRotate;
      controls.autoRotateSpeed = 1.2;
      controls.update();
      renderer.render(scene, camera);
    }

    applyI18n();
    loadAll().then(() => {
      animate();
      setMode('assembled');
    });
  </script>
</body>
</html>
