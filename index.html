    /* ------------------------------------------------------------------ */
    /* Masque des flashs, en coordonnées de coque (x 0..94, y 0..52, z 0..200,
       étrave en +Z). `s` est une coordonnée balayée : à pente constante, une
       ligne s = cte dessine un flash incliné qui file vers l'étrave. Deux
       flashs parallèles à l'arrière, un liseré au ras du livet, et la pointe
       d'étrave reprise en couleur.                                          */
    /* Contour du capot, relevé sur son maillage (enveloppe convexe de la
       projection, ré-échantillonnée en 56 points, périmètre 327 mm).
       La ligne de démarcation est tracée à distance constante de ce contour,
       et cette distance est calculée par SOMMET au chargement plutôt
       qu'approchée dans le shader : le capot n'a aucun redan sur lequel
       s'accrocher — c'est un dôme continu — et les formes analytiques que
       j'ai essayées s'en écartaient de plusieurs millimètres.               */
    const COVER_OUT = [[36.4,0.14],[31.24,2.87],[26.34,6.04],[21.78,9.67],[17.62,13.77],[13.92,18.28],[10.73,23.16],[8.09,28.36],[6.01,33.81],[4.54,39.46],[3.67,45.22],[3.4,51.05],[3.33,56.89],[3.32,62.73],[3.35,68.56],[3.42,74.4],[3.52,80.23],[3.66,86.07],[3.82,91.9],[4.01,97.74],[4.21,103.57],[4.43,109.4],[5.75,115.06],[8.95,119.9],[13.62,123.35],[19.17,125.06],[24.91,126.13],[30.65,127.18],[36.4,128.23],[42.14,127.18],[47.88,126.13],[53.62,125.06],[59.17,123.35],[63.84,119.9],[67.04,115.06],[68.37,109.4],[68.59,103.57],[68.78,97.74],[68.97,91.9],[69.13,86.07],[69.27,80.23],[69.38,74.4],[69.44,68.56],[69.47,62.73],[69.46,56.89],[69.39,51.05],[69.12,45.23],[68.25,39.46],[66.78,33.81],[64.71,28.36],[62.06,23.16],[58.86,18.28],[55.17,13.77],[51.01,9.67],[46.46,6.03],[41.55,2.87]];

    function rimDistances(geo) {
      const pos = geo.attributes.position, n = pos.count;
      const d = new Float32Array(n), m = COVER_OUT.length;
      for (let i = 0; i < n; i++) {
        const px = pos.getX(i), py = pos.getY(i);
        let best = 1e9;
        for (let k = 0; k < m; k++) {
          const a = COVER_OUT[k], b = COVER_OUT[(k + 1) % m];
          const ex = b[0] - a[0], ey = b[1] - a[1];
          const t = Math.max(0, Math.min(1,
            ((px - a[0]) * ex + (py - a[1]) * ey) / (ex * ex + ey * ey)));
          const dx = px - (a[0] + t * ex), dy = py - (a[1] + t * ey);
          const q = dx * dx + dy * dy;
          if (q < best) best = q;
        }
        d[i] = Math.sqrt(best);
      }
      geo.setAttribute('aRim', new THREE.BufferAttribute(d, 1));
    }

    /* Masque de peinture, en coordonnées de pièce.
       `mode` 0 = coque, 1 = capot.

       Coque : `s = y + 0.135 (200 - z)` est une coordonnée balayée, haute à
       l'étrave et basse au tableau ; deux lignes `s = cte` filent le long des
       hauts et convergent vers l'avant. La peinture est bornée par la NORMALE,
       pas par la demi-largeur : à l'étrave la coque se rétrécit, et une porte
       en `|x - 47|` s'y éteignait — d'où les traits qui s'effaçaient devant.
       Une face tournée vers le flanc l'est autant à l'étrave qu'au milieu.

       Capot : la ligne de démarcation est sa ceinture verticale. On la prend
       par la normale elle aussi, ce qui la fait suivre exactement le contour
       de la pièce, sans avoir à en approcher la forme.

       Les transitions font 0.4 mm : de quoi éviter l'escalier, pas de quoi
       faire un dégradé — les traits sont pleins.                            */
    const LIVERY_MASK = `
      float livMask(vec3 q, vec3 n, float mode) {
        if (mode > 0.5) {
          /* Capot : ligne parallèle au contour, à 2.4 mm du bord et 1.7 mm de
             large, sur la face vue seulement — sinon elle serait peinte aussi
             sous la collerette, du côté du joint.                           */
          float line = smoothstep(2.30, 2.50, vRimD) * (1.0 - smoothstep(3.90, 4.10, vRimD));
          return line * smoothstep(0.05, 0.25, n.z);
        }
        float side  = smoothstep(0.16, 0.28, abs(n.x));          // flancs
        float above = smoothstep(9.6, 10.4, q.y);                // au-dessus du bouchain
        float s = q.y + 0.135 * (200.0 - q.z);
        float f1  = 1.0 - smoothstep(4.3, 4.7, abs(s - 45.0));   // flash large
        float f2  = 1.0 - smoothstep(1.8, 2.2, abs(s - 36.5));   // liseré bas
        float bow = smoothstep(190.0, 193.0, q.z);               // pointe d'étrave
        return clamp(max(f1, f2) * side * above + bow, 0.0, 1.0);
      }`;

    function makeLiveryMat(color, mode = 0) {
      const m = new THREE.MeshLambertMaterial({ color, side: THREE.DoubleSide });
      m.userData.acc  = { value: new THREE.Color(0x000000) };
      m.userData.on   = { value: 0 };
      m.userData.mode = { value: mode };
      /* three cache les programmes compilés en incluant `onBeforeCompile` sous
         forme de texte dans la clé : les deux matériaux de livrée ayant la même
         source, le capot héritait du programme de la coque — sans l'attribut
         `aRim`, donc sans sa ligne. La clé doit distinguer les deux modes.   */
      m.customProgramCacheKey = () => 'livery' + mode;
      m.onBeforeCompile = sh => {
        sh.uniforms.uAcc  = m.userData.acc;
        sh.uniforms.uOn   = m.userData.on;
        sh.uniforms.uMode = m.userData.mode;
        sh.vertexShader = sh.vertexShader
          .replace('#include <common>',
                   '#include <common>\nvarying vec3 vLoc;\nvarying vec3 vNrm;\nvarying float vRimD;' +
                   (mode ? '\nattribute float aRim;' : ''))
          .replace('#include <begin_vertex>',
                   '#include <begin_vertex>\nvLoc = position;\nvNrm = normal;\n' +
                   (mode ? 'vRimD = aRim;' : 'vRimD = 0.0;'));
        sh.fragmentShader = sh.fragmentShader
          .replace('#include <common>',
            '#include <common>\nvarying vec3 vLoc;\nvarying vec3 vNrm;\nvarying float vRimD;\n' +
            'uniform vec3 uAcc;\nuniform float uOn;\nuniform float uMode;\n' + LIVERY_MASK)
          .replace('#include <color_fragment>',
            '#include <color_fragment>\ndiffuseColor.rgb = mix(diffuseColor.rgb, uAcc, ' +
            'livMask(vLoc, normalize(vNrm), uMode) * uOn);');
      };
      return m;
    }

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d1117);
    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.5, 4000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.5;
    document.getElementById('canvas-wrap').appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    scene.add(new THREE.AmbientLight(0xffffff, .5));
    scene.add(new THREE.HemisphereLight(0xe0f0ff, 0x3a3a3a, 1.35));
    const d1 = new THREE.DirectionalLight(0xffffff, 2.3); d1.position.set(120, 180, 90); scene.add(d1);
    const d2 = new THREE.DirectionalLight(0xaaccff, 1.1); d2.position.set(-90, 70, -120); scene.add(d2);

    let grid = null;
    function setGrid(size) {
      if (grid) { scene.remove(grid); grid.geometry.dispose(); grid.material.dispose(); }
      grid = new THREE.GridHelper(size, Math.round(size / 25), 0x39424d, 0x232a32);
      grid.position.y = -0.05;
      grid.visible = document.getElementById('chk-grid').checked;
      scene.add(grid);
    }
    setGrid(400);

    const loader = new STLLoader();
    let loadedCount = 0;
    const items = [];      // une entrée par exemplaire

    function buildGeos(part) {
      return new Promise(resolve => {
        if (!part.file) { resolve(part.geo()); return; }
        loader.load(part.file, geo => {
          geo.computeVertexNormals();
          // Les STL gardent leur repère d'origine (aucun geo.center()) : pos[] les
          // place sur leurs portées réelles. Seule exception, une pièce tournante
          // doit avoir son axe sur l'origine du maillage, sinon elle décrit un
          // cercle au lieu de tourner sur elle-même.
          if (part.pivot) geo.translate(-part.pivot[0], -part.pivot[1], -part.pivot[2]);
          if (part.id === 'cover') rimDistances(geo);
          resolve([geo]);
        }, undefined, () => resolve([box(1, 1, 1)]));
      });
    }

    async function loadAll() {
      for (const part of PARTS) {
        const geos = await buildGeos(part);
        part.mat = part.id === 'hull'  ? makeLiveryMat(part.color, 0)
                 : part.id === 'cover' ? makeLiveryMat(part.color, 1)
                 : new THREE.MeshLambertMaterial({ color: part.color, side: THREE.DoubleSide });
        part.color0 = part.color;              // teinte d'atelier, pour y revenir
        part.objs = [];
        part.at.forEach(inst => {
          const o = new THREE.Group();
          geos.forEach(g => o.add(new THREE.Mesh(g, part.mat)));
          scene.add(o);
          part.objs.push(o);
          items.push({
            part, obj: o,
            asmPos: new THREE.Vector3(...inst.pos).add(G),
            asmQuat: new THREE.Quaternion().setFromEuler(new THREE.Euler(...(inst.rot ?? [0, 0, 0]))),
            layPos: new THREE.Vector3(), layQuat: new THREE.Quaternion(), lift: 0, t0: 0, t1: 1
          });
        });
        loadedCount++;
        document.getElementById('load-fill').style.width = (loadedCount / PARTS.length * 100) + '%';
      }
      layout();
      timeline();
      buildList();
      buildLiveryRow();
      apply();
      fitCamera(true);
      document.getElementById('loading').classList.add('hidden');
    }

    /* --- disposition à plat : rangées de pièces posées sur le plan ------- */
    function layout() {
      const ROW_W = 330, GAP = 8;
      let cx = -ROW_W / 2, cz = 0, rowD = 0;
      const bb = new THREE.Box3(), sz = new THREE.Vector3(), ctr = new THREE.Vector3();
      for (const part of PARTS) {
        const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(
          part.lay === 'flat' ? R2 : part.lay === 'flip' ? -R2 : 0, 0, 0));
        part.objs.forEach(o => {
          o.quaternion.copy(q); o.position.set(0, 0, 0); o.updateMatrixWorld(true);
          bb.setFromObject(o); bb.getSize(sz); bb.getCenter(ctr);
          if (cx + sz.x > ROW_W / 2) { cx = -ROW_W / 2; cz += rowD + GAP * 2.4; rowD = 0; }
          const it = items.find(i => i.obj === o);
          it.layQuat.copy(q);
          it.layPos.set(cx + sz.x / 2 - ctr.x, -bb.min.y, cz + sz.z / 2 - ctr.z);
          cx += sz.x + GAP;
          rowD = Math.max(rowD, sz.z);
        });
      }
      // recentre la table de montage
      const zc = (cz + rowD) / 2;
      items.forEach(i => i.layPos.z -= zc);
      // le plan de travail épouse la table de montage (emprise réelle des pièces)
      const span = new THREE.Box3(), ib = new THREE.Box3();
      items.forEach(i => {
        i.obj.position.copy(i.layPos); i.obj.quaternion.copy(i.layQuat);
        i.obj.updateMatrixWorld(true);
        span.union(ib.setFromObject(i.obj));
      });
      setGrid(Math.ceil(Math.max(span.max.x - span.min.x, span.max.z - span.min.z) / 25 + 2) * 25);
    }

    /* --- fenêtre temporelle : un créneau par pièce, exemplaires décalés ---
       Découper par exemplaire donnerait 45 des 54 créneaux à la visserie ;
       chaque ligne de nomenclature reçoit donc une part égale du temps.   */
    function timeline() {
      const N = PARTS.length, SLOT = 0.20;
      let k = 0;
      PARTS.forEach((part, i) => {
        const base = (i / N) * (1 - SLOT);
        part.objs.forEach((o, j) => {
          const it = items.find(x => x.obj === o);
          it.t0 = base + (part.objs.length > 1 ? j / part.objs.length * SLOT * 0.45 : 0);
          it.t1 = it.t0 + SLOT * 0.55;
          it.lift = 12 + 26 * Math.abs(Math.sin(k++ * 2.399));
        });
      });
    }

    /* ------------------------------------------------------------------ */
    let asm = 0, explodeAmount = 0, target = null, spinAngle = 0;
    const smooth = u => u * u * (3 - 2 * u);
    const tmpV = new THREE.Vector3();

    function apply() {
      for (const it of items) {
        const u = smooth(THREE.MathUtils.clamp((asm - it.t0) / (it.t1 - it.t0), 0, 1));
        it.obj.position.lerpVectors(it.layPos, it.asmPos, u);
        it.obj.position.y += it.lift * Math.sin(Math.PI * u);
        it.obj.quaternion.slerpQuaternions(it.layQuat, it.asmQuat, u);
        if (explodeAmount > 0 && u > 0.999) {
          const e = it.part.explode;
          if (e) tmpV.set(e[0], e[1], e[2]);
          else tmpV.copy(it.asmPos).normalize().multiplyScalar(46);
          it.obj.position.addScaledVector(tmpV, explodeAmount / 100);
        }
      }
    }

    /* --- animation ------------------------------------------------------ */
    function goTo(v) { target = v; }
    function stepAnim(dt) {
      if (target === null) return;
      const dir = Math.sign(target - asm);
      asm = THREE.MathUtils.clamp(asm + dir * dt / 3.4, 0, 1);
      if ((dir > 0 && asm >= target) || (dir < 0 && asm <= target)) {
        asm = target; target = null;
        if (!guide) fitCamera();
      }
      setAsm(asm, false);
    }

    function setAsm(v, stop = true) {
      asm = THREE.MathUtils.clamp(v, 0, 1);
      if (stop) target = null;
      document.getElementById('asm-slider').value = Math.round(asm * 100);
      document.getElementById('asm-val').textContent = Math.round(asm * 100) + '%';
      apply();
      showPhase();
      if (!guide && stop && (asm <= 0.001 || asm >= 0.999)) fitCamera();
    }

    const phaseEl = document.getElementById('phase');
    function showPhase() {
      let label = null;
      if (asm <= 0.001) label = t('ph-flat');
      else if (asm >= 0.999) label = t('ph-done');
      else {
        const moving = items.filter(i => asm > i.t0 && asm < i.t1);
        const p = (moving.length ? moving[moving.length - 1] : items[0]).part;
        label = p.name[lang];
      }
      phaseEl.textContent = label;
      phaseEl.classList.add('on');
      clearTimeout(showPhase.tid);
      showPhase.tid = setTimeout(() => phaseEl.classList.remove('on'), 1600);
    }

    /* --- cadrage -------------------------------------------------------- */
    let camGoal = null;
    const DEF_DIR = new THREE.Vector3(0.78, 0.46, -0.72).normalize();

    function fitCamera(instant = false) {
      const bb = new THREE.Box3();
      items.forEach(i => { if (i.obj.visible) bb.expandByObject(i.obj); });
      frame(bb, DEF_DIR, 1.1, instant);
    }
    // az = azimut en degrés (0 = vu de la proue, 180 = vu de la poupe), el = élévation
    const dirOf = (az, el) => {
      const a = THREE.MathUtils.degToRad(az), e = THREE.MathUtils.degToRad(el);
      return new THREE.Vector3(Math.sin(a) * Math.cos(e), Math.sin(e), Math.cos(a) * Math.cos(e)).normalize();
    };

    function frame(bb, dir, pad = 1.1, instant = false) {
      if (bb.isEmpty()) return;
      const c = bb.getCenter(new THREE.Vector3());
      const tv = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2), th = tv * camera.aspect;
      const right = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0, 1, 0)).normalize();
      const up = new THREE.Vector3().crossVectors(right, dir).normalize();
      const p = new THREE.Vector3();
      let dist = 0;
      for (let i = 0; i < 8; i++) {
        p.set(i & 1 ? bb.max.x : bb.min.x, i & 2 ? bb.max.y : bb.min.y, i & 4 ? bb.max.z : bb.min.z).sub(c);
        const depth = p.dot(dir);
        dist = Math.max(dist, depth + Math.abs(p.dot(right)) / th, depth + Math.abs(p.dot(up)) / tv);
      }
      const pos = c.clone().addScaledVector(dir, dist * pad);
      if (instant) { controls.target.copy(c); camera.position.copy(pos); controls.update(); camGoal = null; }
      else camGoal = { c, pos };
    }
    function stepCam(dt) {
      if (!camGoal) return;
      const k = 1 - Math.pow(0.002, dt);
      controls.target.lerp(camGoal.c, k);
      camera.position.lerp(camGoal.pos, k);
      if (camera.position.distanceTo(camGoal.pos) < 0.4) camGoal = null;
    }

    /* --- inventaire ----------------------------------------------------- */
    const GROUPS = ['g-print', 'g-drive', 'g-elec', 'g-fix', 'g-case'];
    /* Application d'une livrée. « Atelier » remet les teintes d'origine, celles
       qui servent à distinguer les pièces au montage ; les cinq autres passent
       tout en anthracite et ne laissent la couleur qu'aux flashs de coque, au
       pont et aux trims — la boîte de rangement, elle, garde sa teinte.      */
    let livery = 'atelier';
    const ACCENT_PARTS = ['trim15', 'trim20'];
    const DARK_PARTS   = ['nozzle', 'stator', 'prop', 'clevis', 'rcmount'];

    function setLivery(id) {
      const L = LIVERIES.find(l => l.id === id) || LIVERIES[0];
      livery = L.id;
      for (const part of PARTS) {
        if (part.grp === 'g-case') continue;
        if (!L.accent) { part.mat.color.setHex(part.color0); continue; }
        if (part.id === 'hull')                  part.mat.color.setHex(LIV_HULL);
        else if (part.id === 'cover')            part.mat.color.setHex(LIV_DECK);
        else if (ACCENT_PARTS.includes(part.id)) part.mat.color.setHex(L.accent);
        else if (DARK_PARTS.includes(part.id))   part.mat.color.setHex(LIV_DARK);
        else                                     part.mat.color.setHex(part.color0);
      }
      for (const id of ['hull', 'cover']) {
        const q = PARTS.find(x => x.id === id);
        if (!q || !q.mat.userData.on) continue;
        q.mat.userData.on.value = L.accent ? 1 : 0;
        if (L.accent) q.mat.userData.acc.value.setHex(L.accent);
      }
      document.querySelectorAll('#livery-row button').forEach(b =>
        b.classList.toggle('on', b.dataset.liv === L.id));
      try { localStorage.setItem('jetboat-livery', L.id); } catch (_) {}
    }

    function buildLiveryRow() {
      const row = document.getElementById('livery-row');
      row.innerHTML = '';
      for (const L of LIVERIES) {
        const b = document.createElement('button');
        b.className = 'sw-btn'; b.dataset.liv = L.id;
        b.title = L.name[lang];
        b.style.background = L.sw;
        b.onclick = () => setLivery(L.id);
        row.appendChild(b);
      }
      let saved = 'atelier';
      try { saved = localStorage.getItem('jetboat-livery') || 'atelier'; } catch (_) {}
      setLivery(saved);
    }

    function buildList() {
      const list = document.getElementById('parts-list');
      list.innerHTML = '';
      let n = 0;
      PARTS.forEach(p => { if (p.optional) p.objs.forEach(o => o.visible = false); });
      for (const grp of GROUPS) {
        const h = document.createElement('div');
        h.className = 'grp-title'; h.dataset.grp = grp; h.textContent = t(grp);
        list.appendChild(h);
        for (const part of PARTS.filter(p => p.grp === grp)) {
          n += part.at.length;
          const lab = document.createElement('label');
          lab.className = 'chk';
          lab.innerHTML = `<input type="checkbox"${part.optional ? '' : ' checked'}>
            <span class="sw" style="background:#${part.color.toString(16).padStart(6, '0')}"></span>
            <span class="nm"></span><span class="qty">×${part.at.length}</span>`;
          const nm = lab.querySelector('.nm');
          nm.textContent = part.name[lang];
          nm.dataset.part = part.id;
          lab.querySelector('input').onchange = e => {
            part.objs.forEach(o => o.visible = e.target.checked);
          };
          list.appendChild(lab);
        }
      }
      document.getElementById('parts-count').textContent = `${n}`;
      filterList();
    }

    /* Recherche. 70 pièces dans une colonne, c'est trop pour l'œil : on filtre
       sur le nom, et un intitulé de groupe disparaît quand il ne reste rien
       dessous — sinon on lit des titres vides.                               */
    function filterList() {
      const q = (document.getElementById('parts-search').value || '')
        .trim().toLowerCase();
      const list = document.getElementById('parts-list');
      let shownInGroup = 0, lastTitle = null;
      for (const el of list.children) {
        if (el.classList.contains('grp-title')) {
          if (lastTitle) lastTitle.classList.toggle('hidden-row', shownInGroup === 0);
          lastTitle = el; shownInGroup = 0;
          continue;
        }
        const nm = el.querySelector('.nm');
        const hit = !q || nm.textContent.toLowerCase().includes(q);
        el.classList.toggle('hidden-row', !hit);
        if (hit) shownInGroup++;
      }
      if (lastTitle) lastTitle.classList.toggle('hidden-row', shownInGroup === 0);
    }

    function setLang(l) {
      lang = l;
      document.getElementById('btn-fr').classList.toggle('active', l === 'fr');
      document.getElementById('btn-en').classList.toggle('active', l === 'en');
      document.querySelectorAll('[data-i18n]').forEach(e => e.textContent = t(e.dataset.i18n));
      document.querySelectorAll('[data-i18n-ph]').forEach(e => e.placeholder = t(e.dataset.i18nPh));
      document.querySelectorAll('.grp-title').forEach(e => e.textContent = t(e.dataset.grp));
      document.querySelectorAll('#livery-row button').forEach(b =>
        b.title = (LIVERIES.find(l => l.id === b.dataset.liv) || LIVERIES[0]).name[lang]);
      document.querySelectorAll('#parts-list .nm').forEach(e =>
        e.textContent = PARTS.find(p => p.id === e.dataset.part).name[lang]);
      if (typeof filterList === 'function') filterList();
      if (play) { hudHint(); setCamLabel(); }
      const off = document.body.classList.contains('ui-off');
      document.getElementById('ui-toggle').title = t(off ? 'ui-show' : 'ui-hide');
      document.getElementById('btn-guide').textContent = t(guide ? 'b-quit' : 'b-guide');
      if (guide) renderCard();
      showPhase();
    }

    /* ------------------------------------------------------------------ *
     *  GUIDE : chaque étape amène le montage jusqu'à ses pièces, masque
     *  celles qui viennent après, met en valeur celles de l'étape et place
     *  la caméra sous l'angle qui les montre.
     * ------------------------------------------------------------------ */
    let guide = false, step = 0;
    const stepOf = new Map();          // part.id -> index d'étape
    STEPS.forEach((s, i) => s.parts.forEach(id => stepOf.set(id, i)));

    function stepEnd(i) {              // avancement d'assemblage en fin d'étape
      let e = 0;
      for (const it of items) if (stepOf.get(it.part.id) <= i) e = Math.max(e, it.t1);
      return e;
    }

    function stepBox(i) {              // emprise des pièces de l'étape, une fois montées
      const bb = new THREE.Box3(), one = new THREE.Box3();
      const p = new THREE.Vector3(), q = new THREE.Quaternion();
      for (const it of items) {
        if (stepOf.get(it.part.id) !== i) continue;
        // les pièces sont peut-être encore en vol : on mesure la pose montée
        p.copy(it.obj.position); q.copy(it.obj.quaternion);
        it.obj.position.copy(it.asmPos); it.obj.quaternion.copy(it.asmQuat);
        it.obj.updateMatrixWorld(true);
        bb.union(one.setFromObject(it.obj));
        it.obj.position.copy(p); it.obj.quaternion.copy(q);
        it.obj.updateMatrixWorld(true);
      }
      if (bb.isEmpty()) return bb;
      const sz = bb.getSize(new THREE.Vector3()), c = bb.getCenter(new THREE.Vector3());
      const m = 40;                    // une vis seule ne doit pas coller la caméra au nez
      bb.setFromCenterAndSize(c, sz.max(new THREE.Vector3(m, m, m)));
      return bb;
    }

    function showStep(i, instant = false) {
      step = THREE.MathUtils.clamp(i, 0, STEPS.length - 1);
      const s = STEPS[step];
      // visibilité : tout ce qui est déjà monté, rien de ce qui suit
      PARTS.forEach(p => {
        const vis = stepOf.get(p.id) <= step;
        p.objs.forEach(o => o.visible = vis);
        p.mat.emissive.setHex(stepOf.get(p.id) === step ? 0x40210a : 0x000000);
      });
      document.querySelectorAll('#parts-list input').forEach((inp, k) => {
        const p = PARTS.find(x => x.id === inp.closest('label').querySelector('.nm').dataset.part);
        inp.checked = stepOf.get(p.id) <= step;
      });
      goTo(stepEnd(step));
      frame(stepBox(step), dirOf(s.az, s.el), s.pad, instant);
      renderCard();
    }

    function renderCard() {
      const s = STEPS[step];
      document.getElementById('st-num').textContent = `${t('g-step')} ${step + 1} ${t('g-of')} ${STEPS.length}`;
      document.getElementById('st-title').textContent = s.t[lang];
      document.getElementById('st-desc').textContent = s.d[lang];
      document.getElementById('st-tip').textContent = s.tip[lang];
      document.getElementById('st-tiplabel').textContent = t('g-tip') + ' —';
      document.getElementById('st-prog').style.width = ((step + 1) / STEPS.length * 100) + '%';
      const bom = document.getElementById('st-bom');
      bom.innerHTML = '';
      s.parts.forEach(id => {
        const p = PARTS.find(x => x.id === id);
        const e = document.createElement('span');
        e.innerHTML = `<i style="background:#${p.color.toString(16).padStart(6, '0')}"></i>`;
        e.append(`${p.name[lang]} ×${p.at.length}`);
        bom.appendChild(e);
      });
      document.getElementById('st-prev').disabled = step === 0;
      document.getElementById('st-next').disabled = step === STEPS.length - 1;
    }

    function setGuide(on, keep = false) {
      guide = on;
      document.body.classList.toggle('guide', on);
      document.getElementById('btn-guide').textContent = t(on ? 'b-quit' : 'b-guide');
      if (on) { showStep(keep ? step : 0); }
      else {
        PARTS.forEach(p => {
          p.mat.emissive.setHex(0x000000);
          const vis = !p.optional;
          p.objs.forEach(o => o.visible = vis);
        });
        document.querySelectorAll('#parts-list input').forEach(inp => {
          const p = PARTS.find(x => x.id === inp.closest('label').querySelector('.nm').dataset.part);
          inp.checked = !p.optional;
        });
        goTo(1);
      }
    }

    document.getElementById('btn-guide').onclick = () => setGuide(!guide);
    document.getElementById('st-prev').onclick = () => showStep(step - 1);
    document.getElementById('st-next').onclick = () => showStep(step + 1);
    document.getElementById('st-quit').onclick = () => setGuide(false);
    addEventListener('keydown', e => {
      if (!guide || /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
      if (e.key === 'ArrowRight') showStep(step + 1);
      else if (e.key === 'ArrowLeft') showStep(step - 1);
      else if (e.key === 'Escape') setGuide(false);
    });

    /* --- commandes ------------------------------------------------------ */
    document.getElementById('btn-assemble').onclick = () => { if (guide) setGuide(false); goTo(1); };
    document.getElementById('btn-disassemble').onclick = () => { if (guide) setGuide(false); goTo(0); };
    document.getElementById('asm-slider').oninput = e => { if (guide) setGuide(false); setAsm(+e.target.value / 100); };
    document.getElementById('explode-slider').oninput = e => {
      explodeAmount = +e.target.value;
      document.getElementById('explode-val').textContent = explodeAmount + '%';
      if (explodeAmount > 0 && asm < 1) setAsm(1);
      else apply();
    };
    document.getElementById('btn-show-all').onclick = () => setAllVisible(true);
    document.getElementById('btn-hide-all').onclick = () => setAllVisible(false);
    function setAllVisible(v) {
      PARTS.forEach(p => p.objs.forEach(o => o.visible = v));
      document.querySelectorAll('#parts-list input').forEach(i => i.checked = v);
    }
    document.getElementById('btn-fit').onclick = () => fitCamera();
    document.getElementById('chk-wire').onchange = e => PARTS.forEach(p => p.mat.wireframe = e.target.checked);
    document.getElementById('chk-grid').onchange = e => grid.visible = e.target.checked;
    
    let autoRotate = false, spinOn = true;
    document.getElementById('chk-auto').onchange = e => autoRotate = e.target.checked;
    document.getElementById('chk-spin').onchange = e => spinOn = e.target.checked;
    document.getElementById('btn-fr').onclick = () => setLang('fr');
    document.getElementById('btn-en').onclick = () => setLang('en');

    // panneau latéral escamotable — replié d'office sur les petits écrans
    const uiToggle = document.getElementById('ui-toggle');
    function setUI(open) {
      document.body.classList.toggle('ui-off', !open);
      uiToggle.setAttribute('aria-expanded', open);
      uiToggle.title = t(open ? 'ui-hide' : 'ui-show');
    }
    uiToggle.onclick = () => setUI(document.body.classList.contains('ui-off'));
    addEventListener('keydown', e => {
      if (e.key.toLowerCase() === 'p' && !e.metaKey && !e.ctrlKey && !e.altKey
          && !/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) uiToggle.onclick();
    });
    setUI(innerWidth > 720);

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });


    /* ==================================================================== *
     *  MODE PILOTAGE
     *  Le bateau monté est reparenté dans un groupe `boat` que l'on déplace
     *  sur un plan d'eau. `apply()` continue d'écrire des transformations
     *  LOCALES dans chaque objet : à asm = 1 ce sont exactement les positions
     *  d'assemblage, qui deviennent les offsets des pièces dans le repère du
     *  bateau. Rien d'autre à changer.
     * ==================================================================== */

    /* Houle : somme de quatre sinusoïdes. La même fonction tourne côté GPU
       (déplacement du maillage) et côté CPU (flottaison), avec les mêmes
       coefficients — sinon le bateau ne suivrait pas la vague qu'il montre. */
    const WAVES = [   // amplitude, longueur d'onde, vitesse, direction (rad)
      [ 4.5, 620, 0.55, 0.30],
      [ 2.6, 330, 0.80, 1.15],
      [ 1.2, 170, 1.20, -0.60],
      [ 0.6,  95, 1.70, 2.30],
    ];
    function waveAt(x, z, t, out) {
      let h = 0, dx = 0, dz = 0;
      for (const [a, L, sp, ang] of WAVES) {
        const k = 2 * Math.PI / L, dirx = Math.cos(ang), dirz = Math.sin(ang);
        const ph = k * (dirx * x + dirz * z) + t * sp * k * 60;
        h += a * Math.sin(ph);
        const c = a * k * Math.cos(ph);
        dx += c * dirx; dz += c * dirz;
      }
      if (out) { out.h = h; out.dx = dx; out.dz = dz; }
      return h;
    }

    const WATER_VS = `
      uniform float uTime;
      varying vec3 vW; varying vec3 vN;
      ${WAVES.map(([a, L, sp, ang], i) =>
        `const vec4 W${i} = vec4(${a.toFixed(3)}, ${(2 * Math.PI / L).toFixed(6)}, ${(sp * 60).toFixed(4)}, ${ang.toFixed(4)});`).join('\n      ')}
      void main() {
        vec4 wp = modelMatrix * vec4(position, 1.0);
        float h = 0.0, dx = 0.0, dz = 0.0;
        ${WAVES.map((_, i) => `{
          vec2 d = vec2(cos(W${i}.w), sin(W${i}.w));
          float ph = W${i}.y * dot(d, wp.xz) + uTime * W${i}.z * W${i}.y;
          h += W${i}.x * sin(ph);
          float c = W${i}.x * W${i}.y * cos(ph);
          dx += c * d.x; dz += c * d.y;
        }`).join('\n        ')}
        wp.y += h;
        vW = wp.xyz;
        vN = normalize(vec3(-dx, 1.0, -dz));
        gl_Position = projectionMatrix * viewMatrix * wp;
      }`;

    const WATER_FS = `
      precision highp float;
      uniform vec3 uEye; uniform float uTime;
      varying vec3 vW; varying vec3 vN;
      void main() {
        vec3 n = normalize(vN);
        vec3 v = normalize(uEye - vW);
        float f = pow(1.0 - max(dot(n, v), 0.0), 4.0);            // Fresnel
        vec3 deep    = vec3(0.030, 0.105, 0.150);
        vec3 shallow = vec3(0.075, 0.250, 0.290);
        vec3 sky     = vec3(0.400, 0.560, 0.680);
        vec3 col = mix(deep, shallow, clamp(n.y * 0.5 + 0.5, 0.0, 1.0));
        col = mix(col, sky, clamp(f, 0.0, 0.9));
        vec3 l = normalize(vec3(0.45, 0.72, 0.32));
        float spec = pow(max(dot(reflect(-l, n), v), 0.0), 90.0);
        col += vec3(1.0, 0.97, 0.90) * spec * 0.85;
        float crest = smoothstep(3.5, 6.5, vW.y);                  // écume de crête
        col = mix(col, vec3(0.82, 0.88, 0.92), crest * 0.35);
        float fog = 1.0 - exp(-pow(length(vW.xz) / 5200.0, 2.4));
        col = mix(col, vec3(0.62, 0.71, 0.80), clamp(fog, 0.0, 1.0));
        gl_FragColor = vec4(col, 1.0);
      }`;

    let play = null;                       // état du mode pilotage
    const boat = new THREE.Group();
    scene.add(boat);

    function foamTexture() {
      const c = document.createElement('canvas'); c.width = c.height = 64;
      const g = c.getContext('2d').createRadialGradient(32, 32, 0, 32, 32, 32);
      g.addColorStop(0, 'rgba(255,255,255,.95)');
      g.addColorStop(0.45, 'rgba(226,240,246,.42)');
      g.addColorStop(1, 'rgba(226,240,246,0)');
      const x = c.getContext('2d'); x.fillStyle = g; x.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(c);
    }

    // damier de bouées : maille de 1200 mm, 7 x 7 mailles autour du bateau
    const BUOY_S = 1650, BUOY_R = 3, BUOY_N = (2 * BUOY_R + 1) ** 2;
    const hash = (a, b) => {
      const h = Math.sin(a * 127.1 + b * 311.7) * 43758.5453;
      return h - Math.floor(h);
    };

    function mergeBuoy() {
      // cône + boule, dans un seul buffer : une InstancedMesh, un draw call
      const parts = [];
      const cone = new THREE.ConeGeometry(30, 96, 10); cone.translate(0, 48, 0);
      const ball = new THREE.SphereGeometry(16, 10, 8);  ball.translate(0, 106, 0);
      parts.push(cone, ball);
      const g = new THREE.BufferGeometry();
      const v = [], n = [];
      for (const q of parts) {
        const pa = q.attributes.position, na = q.attributes.normal, idx = q.index;
        for (let k = 0; k < idx.count; k++) {
          const i = idx.getX(k);
          v.push(pa.getX(i), pa.getY(i), pa.getZ(i));
          n.push(na.getX(i), na.getY(i), na.getZ(i));
        }
        q.dispose();
      }
      g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
      g.setAttribute('normal', new THREE.Float32BufferAttribute(n, 3));
      return g;
    }

    function stepBuoys(p, tm) {
      const ci = Math.round(p.x / BUOY_S), cj = Math.round(p.z / BUOY_S);
      const m = new THREE.Matrix4(), q = new THREE.Quaternion(), one = new THREE.Vector3(1, 1, 1);
      const pos = new THREE.Vector3(), e = new THREE.Euler();
      let k = 0;
      for (let i = -BUOY_R; i <= BUOY_R; i++) {
        for (let j = -BUOY_R; j <= BUOY_R; j++) {
          const a = ci + i, b = cj + j;
          const x = a * BUOY_S + (hash(a, b) - .5) * BUOY_S * 0.7;
          const z = b * BUOY_S + (hash(b, a) - .5) * BUOY_S * 0.7;
          const w = {}; waveAt(x, z, tm, w);
          pos.set(x, w.h - 22, z);
          e.set(Math.atan(w.dz) * 0.9, 0, -Math.atan(w.dx) * 0.9);
          m.compose(pos, q.setFromEuler(e), one);
          p.buoys.setMatrixAt(k++, m);
        }
      }
      p.buoys.instanceMatrix.needsUpdate = true;
    }

    function buildWorld() {
      const water = new THREE.Mesh(
        new THREE.PlaneGeometry(11000, 11000, 220, 220),
        new THREE.ShaderMaterial({
          vertexShader: WATER_VS, fragmentShader: WATER_FS,
          uniforms: { uTime: { value: 0 }, uEye: { value: new THREE.Vector3() } }
        }));
      water.rotation.x = -Math.PI / 2;

      const sky = new THREE.Mesh(
        new THREE.SphereGeometry(6000, 32, 20),
        new THREE.ShaderMaterial({
          side: THREE.BackSide,
          vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
          fragmentShader: `varying vec3 vP;
            void main() {
              float h = clamp(vP.y / 6000.0, -1.0, 1.0);
              vec3 top = vec3(0.24, 0.42, 0.66), mid = vec3(0.62, 0.74, 0.84), low = vec3(0.72, 0.76, 0.78);
              vec3 c = h > 0.0 ? mix(mid, top, pow(h, 0.65)) : mix(mid, low, -h);
              gl_FragColor = vec4(c, 1.0);
            }`
        }));

      /* Sillage. V1 ne savait poser que de l'écume à plat sur l'eau. V2 gère
         deux familles dans le même nuage : `kind` 0, l'écume qui s'étale à la
         surface ; `kind` 1, les gouttes balistiques — gerbe de jet, moustaches
         d'étrave, gicle d'impact — qui montent, retombent et meurent en
         touchant l'eau.                                                       */
      const N = 1400;
      const pos = new Float32Array(N * 3), siz = new Float32Array(N), alp = new Float32Array(N);
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      g.setAttribute('size', new THREE.BufferAttribute(siz, 1));
      g.setAttribute('alpha', new THREE.BufferAttribute(alp, 1));
      const foam = new THREE.Points(g, new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, blending: THREE.NormalBlending,
        uniforms: { uMap: { value: foamTexture() } },
        vertexShader: `attribute float size; attribute float alpha; varying float vA;
          void main(){ vA = alpha; vec4 mv = modelViewMatrix * vec4(position,1.0);
            gl_PointSize = min(size * 320.0 / -mv.z, 70.0); gl_Position = projectionMatrix * mv; }`,
        fragmentShader: `uniform sampler2D uMap; varying float vA;
          void main(){ vec4 t = texture2D(uMap, gl_PointCoord); gl_FragColor = vec4(t.rgb, t.a * vA); }`
      }));
      foam.frustumCulled = false;

      /* Bouées. En pleine eau, rien ne défile : sans repère fixe, plein gaz et
         moteur coupé se ressemblent. Un damier de bouées ancré au monde, dont
         on n'instancie que les mailles proches du bateau, donne le défilement
         et la parallaxe — et l'océan reste infini.                            */
      const bg = mergeBuoy();
      const buoys = new THREE.InstancedMesh(bg,
        new THREE.MeshLambertMaterial({ color: 0xff6a1a }), BUOY_N);
      buoys.frustumCulled = false;
      buoys.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

      return { water, sky, foam, buoys, n: N, head: 0,
               life: new Float32Array(N), seed: new Float32Array(N),
               kind: new Uint8Array(N),  vel: new Float32Array(N * 3) };
    }

    /* --- manette / clavier ----------------------------------------------
       Chrome n'expose une manette qu'APRÈS un premier appui bouton, page au
       premier plan : `navigator.getGamepads()` renvoie des cases vides tant
       que ce n'est pas fait, même si le pad est parfaitement appairé. D'où
       l'écoute de `gamepadconnected`, et le message d'aide explicite.        */
    const keys = new Set();
    addEventListener('keydown', e => { if (play) keys.add(e.key.toLowerCase()); });
    addEventListener('keyup',   e => keys.delete(e.key.toLowerCase()));

    let padName = null;
    addEventListener('gamepadconnected',    e => {
      padName = (e && e.gamepad && e.gamepad.id) || 'manette'; if (play) hudHint();
    });
    addEventListener('gamepaddisconnected', e => { padName = null; if (play) hudHint(); });

    function firstPad() {
      const pads = navigator.getGamepads ? navigator.getGamepads() : [];
      for (const g of pads) if (g && g.connected) return g;
      return null;
    }

    function readInput() {
      const gp = firstPad();
      const dz = v => Math.abs(v) < 0.12 ? 0 : (v - Math.sign(v) * 0.12) / 0.88;
      let thr = 0, str = 0, camX = 0, camY = 0, recentre = false;
      if (gp) {
        const nb = gp.buttons.length, na = gp.axes.length;
        const b = i => (i < nb && gp.buttons[i])
          ? (gp.buttons[i].value || (gp.buttons[i].pressed ? 1 : 0)) : 0;
        const ax = i => i < na ? (gp.axes[i] ?? 0) : 0;

        if (gp.mapping === 'standard' || nb >= 8) {
          thr = b(7) - b(6) * 0.6;                     // R2 avant, L2 arrière
          str = dz(ax(0));
          camX = dz(ax(2)); camY = dz(ax(3));
          recentre = b(0) > 0.5;
        } else {
          /* Mapping non standard (DualShock en DirectInput sous Firefox, par
             exemple) : les gâchettes arrivent sur des axes au repos à -1, et
             le stick droit se décale d'un cran.                             */
          const tr = i => i < na ? (ax(i) + 1) / 2 : 0;
          thr = tr(5) - tr(4) * 0.6;
          str = dz(ax(0));
          camX = dz(ax(2)); camY = dz(ax(na > 5 ? 5 : 3));
          recentre = b(0) > 0.5 || b(1) > 0.5;
        }
        // Repli universel : si rien n'est arrivé par les gâchettes, le stick
        // gauche en Y fait les gaz. Une manette mal mappée reste jouable.
        if (Math.abs(thr) < 0.02) thr = -dz(ax(1));
      }
      const K = k => keys.has(k) ? 1 : 0;
      thr += K('arrowup') + K('z') + K('w') - 0.6 * (K('arrowdown') + K('s'));
      str += K('arrowright') + K('d') - (K('arrowleft') + K('q') + K('a'));
      return {
        pad: gp ? (gp.id || 'manette') : null,
        thr: THREE.MathUtils.clamp(thr, -0.6, 1),
        str: THREE.MathUtils.clamp(str, -1, 1),
        camX, camY, recentre
      };
    }

    /* --- physique -------------------------------------------------------- */
    /* Un jet-boat ne gouverne que sous les gaz : la tuyère dévie le jet, il
       n'y a pas de safran. Couper les gaz en virage, c'est perdre la barre —
       le modèle le reproduit, le lacet vient du seul jet.                   */
    const P_VMAX = 2600,                       // vitesse limite, mm/s (2.6 m/s)
          P_THRUST = 2600,                     // accélération plein gaz, mm/s²
          P_DRAG = P_THRUST / (P_VMAX * P_VMAX),
          P_YAW = 3.0, P_YAWD = 2.0,           // autorité et amortissement en lacet
          P_NOZ = 0.62,                        // braquage maxi de la tuyère (35°)
          P_SCRUB = 0.9;                       // freinage en virage
    const NOZ_PIVOT = new THREE.Vector3(0, 15.11, -86.66);   // rotule du stator (monde)

    function stepPlay(dt, tm) {
      const inp = readInput();
      const p = play;
      p.thr += (inp.thr - p.thr) * Math.min(1, dt * 6);
      p.str += (inp.str - p.str) * Math.min(1, dt * 7);

      const noz = p.str * P_NOZ;                       // braquage de la tuyère
      const thrust = p.thr * P_THRUST;
      // dv/dt = poussée·cos(braquage) − traînée quadratique.
      // P_DRAG = P_THRUST / P_VMAX² : la vitesse limite tombe pile sur P_VMAX.
      p.v += (thrust * Math.cos(noz) - P_DRAG * p.v * Math.abs(p.v)) * dt;
      p.v = THREE.MathUtils.clamp(p.v, -P_VMAX * 0.35, P_VMAX);
      /* Lacet : uniquement la composante latérale du jet.
         Attention au repère, c'est là que je me suis trompé deux fois.
         L'étrave est en +Z. Caméra derrière le bateau, elle regarde donc vers
         +Z, et l'axe monde +X part alors vers la GAUCHE de l'écran
         (right = cross(regard, haut) = (0,0,1)×(0,1,0) = (-1,0,0)).
         Le +X local du modèle est donc BÂBORD, pas tribord.
         Barre à droite, on veut l'étrave vers la droite de l'écran, c'est-à-
         dire vers -X : cap = (sin yaw, cos yaw) doit voir son sin diminuer,
         donc lacet NÉGATIF. Et la tuyère doit envoyer le jet vers -X.        */
      p.r += (-Math.sin(noz) * thrust * P_YAW / 1000 - p.r * P_YAWD) * dt;
      p.yaw += p.r * dt;
      // en virage serré la carène ripe et freine — c'est ce qui resserre le rayon
      p.v -= Math.abs(Math.sin(noz)) * p.v * P_SCRUB * dt;

      const fx = Math.sin(p.yaw), fz = Math.cos(p.yaw);
      p.x += fx * p.v * dt; p.z += fz * p.v * dt;

      /* Flottaison. V1 posait la carène sur la hauteur et la pente de la vague
         en UN point : le bateau collait au relief, il ne le franchissait pas.
         V2 sonde quatre points de la carène — étrave, tableau, les deux bords —
         et en tire l'assiette : sur une vague courte l'étrave porte encore que
         le tableau est déjà retombé, et ça se voit.                          */
      const hAt = (lx, lz) => waveAt(p.x + lx * fz + lz * fx, p.z - lx * fx + lz * fz, tm);
      const hBow = hAt(0, 108), hStern = hAt(0, -108), hPort = hAt(42, 0), hStbd = hAt(-42, 0);
      const w = { h: (hBow + hStern + hPort + hStbd) / 4 };

      const acc = (p.v - p.prevV) / Math.max(dt, 1e-3); p.prevV = p.v;
      const u = Math.abs(p.v) / P_VMAX;

      /* Déjaugeage. En déplacement la carène laboure, l'étrave se cabre ; passé
         la bosse de résistance elle redescend et le bateau glisse sur son arrière
         en s'élevant. On interpole entre les deux régimes.                    */
      const planeGoal = THREE.MathUtils.smoothstep(u, 0.30, 0.80);
      p.plane += (planeGoal - p.plane) * Math.min(1, dt * 2.0);
      const hump = Math.sin(Math.PI * THREE.MathUtils.clamp(u / 0.8, 0, 1)) * 0.11;
      const trim = THREE.MathUtils.clamp(acc / 2600, -0.10, 0.16)
                 + hump + p.plane * 0.045;
      const bank = THREE.MathUtils.clamp(-p.r * p.v / 9000, -0.32, 0.32);
      const draft = -11 + p.plane * 6;                 // la carène monte en glisse

      // pitch positif pique de l'étrave, roll positif lève bâbord (+X)
      const pWave = -Math.atan2(hBow - hStern, 216);
      const rWave =  Math.atan2(hPort - hStbd, 84);
      // impact : le tableau qui retombe sur la vague fait gicler et vibrer
      const dPitch = (pWave - (p.pWave ?? pWave)) / Math.max(dt, 1e-3);
      p.pWave = pWave;
      p.slam = Math.max(0, Math.min(1, Math.abs(dPitch) * u * 0.9));

      boat.position.set(p.x, w.h + draft, p.z);
      boat.quaternion.setFromEuler(
        new THREE.Euler(pWave - trim, p.yaw, rWave + bank, 'YXZ'));

      // Tuyère braquée autour de la rotule du stator. Sa queue est en -Z ;
      // une rotation de +noz autour de Y l'envoie vers -X, du côté vers lequel
      // le bateau doit tourner — les deux vont enfin dans le même sens.
      if (p.noz) {
        const q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), noz);
        p.noz.obj.position.copy(p.noz.asmPos).sub(NOZ_PIVOT).applyQuaternion(q).add(NOZ_PIVOT);
        p.noz.obj.quaternion.copy(q).multiply(p.noz.asmQuat);
      }

      // sillage
      const pa = p.foam.geometry.attributes, PP = pa.position.array, PV = p.vel;
      const spawn = (wp, spread, s0, kind, vel) => {
        const i = p.head; p.head = (p.head + 1) % p.n;
        PP[i * 3]     = wp.x + (Math.random() - .5) * spread;
        PP[i * 3 + 1] = wp.y;
        PP[i * 3 + 2] = wp.z + (Math.random() - .5) * spread;
        if (vel) { PV[i * 3] = vel.x; PV[i * 3 + 1] = vel.y; PV[i * 3 + 2] = vel.z; }
        else PV[i * 3] = PV[i * 3 + 1] = PV[i * 3 + 2] = 0;
        p.life[i] = 1; p.seed[i] = s0; p.kind[i] = kind;
      };
      const rnd = a => (Math.random() - .5) * a;
      const speed = Math.abs(p.v);
      p.emit += Math.min(1, speed / 600) * (0.4 + Math.abs(p.thr)) * dt * 150;
      while (p.emit >= 1) {
        p.emit -= 1;
        // écume plate : les deux moustaches d'étrave et le remous du jet
        spawn(boat.localToWorld(tmpV.set(-34, 2, 96)), 16, 9, 0);
        spawn(boat.localToWorld(tmpV.set( 34, 2, 96)), 16, 9, 0);
        spawn(boat.localToWorld(tmpV.set(  0, 2, -122)), 30, 26, 0);
      }
      /* Gerbe du jet — le « rooster tail ». Elle ne sort qu'aux gaz et grandit
         avec eux : c'est la signature d'un jet-boat, une turbine qui crache en
         l'air derrière le tableau.                                            */
      p.emitJet += Math.max(0, p.thr) * Math.min(1, speed / 500) * dt * 220;
      while (p.emitJet >= 1) {
        p.emitJet -= 1;
        const back = boat.localToWorld(tmpV.set(0, 14, -128)).clone();
        const vy = 420 + Math.random() * 380 + speed * 0.14;
        spawn(back, 9, 4, 1, new THREE.Vector3(
          -fx * speed * 0.5 + rnd(120), vy, -fz * speed * 0.5 + rnd(120)));
      }
      // gicle d'impact quand le tableau retombe sur la vague
      p.emitSlam += p.slam * dt * 340;
      while (p.emitSlam >= 1) {
        p.emitSlam -= 1;
        const bow = boat.localToWorld(tmpV.set(rnd(70), 4, 92)).clone();
        spawn(bow, 24, 5, 1, new THREE.Vector3(rnd(420), 300 + Math.random() * 420, rnd(420)));
      }

      for (let i = 0; i < p.n; i++) {
        if (p.life[i] <= 0) { pa.alpha.array[i] = 0; continue; }
        const j = i * 3;
        if (p.kind[i]) {                       // goutte balistique
          p.life[i] -= dt / 1.5;
          PV[j + 1] -= 2600 * dt;              // pesanteur
          PP[j] += PV[j] * dt; PP[j + 1] += PV[j + 1] * dt; PP[j + 2] += PV[j + 2] * dt;
          const surf = waveAt(PP[j], PP[j + 2], tm);
          if (PP[j + 1] <= surf) { p.life[i] = 0; pa.alpha.array[i] = 0; continue; }
          pa.size.array[i]  = p.seed[i] + (1 - p.life[i]) * 10;
          pa.alpha.array[i] = Math.min(1, p.life[i] * 1.6) * 0.8;
        } else {                               // écume étalée à la surface
          p.life[i] -= dt / 3.0;
          const a = 1 - Math.max(0, p.life[i]);
          PP[j + 1] = 2 + waveAt(PP[j], PP[j + 2], tm);
          pa.size.array[i]  = p.seed[i] + a * 62;
          pa.alpha.array[i] = Math.max(0, p.life[i]) * 0.62 * (1 - a * 0.35);
        }
      }
      pa.position.needsUpdate = pa.size.needsUpdate = pa.alpha.needsUpdate = true;

      /* Caméra. Deux modes : poursuite dans l'axe du bateau, ou orbite libre
         — les mêmes commandes que le visualiseur 3D, mais la cible suit le
         bateau. On bascule en orbite dès qu'on touche la souris, et la croix
         de la manette (ou le bouton du HUD) ramène en poursuite.           */
      const pivot = new THREE.Vector3(p.x, w.h + 24, p.z);
      if (inp.recentre) setCam('chase');
      if (p.cam === 'onboard') {
        /* Vue embarquée : l'œil est posé sur le pont, derrière le capot, et
           subit toute l'assiette du bateau. C'est là qu'on sent le déjaugeage
           et les coups de tableau.                                           */
        p.cx -= inp.camX * dt * 2.2;
        p.cy = THREE.MathUtils.clamp(p.cy - inp.camY * dt * 1.4, -0.5, 0.6);
        boat.updateMatrixWorld(true);
        camera.position.copy(boat.localToWorld(tmpV.set(0, 62, -46)));
        camera.quaternion.copy(boat.quaternion);
        camera.rotateY(Math.PI + p.cx);
        camera.rotateX(-0.06 + p.cy * 0.5);
        controls.target.copy(pivot);
      } else if (p.cam === 'chase') {
        p.cx -= inp.camX * dt * 2.2;
        p.cy = THREE.MathUtils.clamp(p.cy - inp.camY * dt * 1.4, -0.35, 0.9);
        const a = p.yaw + Math.PI + p.cx, dist = 330 + Math.abs(p.v) * 0.075;
        const goal = new THREE.Vector3(
          p.x + Math.sin(a) * dist * Math.cos(p.cy * 0.7),
          w.h + 92 + p.cy * 210,
          p.z + Math.cos(a) * dist * Math.cos(p.cy * 0.7));
        camera.position.lerp(goal, Math.min(1, dt * 3.2));
        p.look.lerp(new THREE.Vector3(p.x + fx * 70, w.h + 26, p.z + fz * 70), Math.min(1, dt * 5));
        camera.lookAt(p.look);
        controls.target.copy(pivot);            // pour une bascule sans à-coup
      } else {
        // la cible se déplace avec le bateau ; la caméra suit du même vecteur,
        // ce qui conserve exactement l'orientation et la distance choisies
        tmpV.copy(pivot).sub(controls.target);
        camera.position.add(tmpV);
        controls.target.copy(pivot);
        if (inp.camX || inp.camY) {             // stick droit : orbite aussi
          const off = camera.position.clone().sub(pivot);
          const sph = new THREE.Spherical().setFromVector3(off);
          sph.theta -= inp.camX * dt * 2.2;
          sph.phi = THREE.MathUtils.clamp(sph.phi + inp.camY * dt * 1.4, 0.12, Math.PI / 2 - 0.03);
          camera.position.copy(pivot).add(new THREE.Vector3().setFromSpherical(sph));
        }
        controls.update();
      }

      stepBuoys(p, tm);
      p.water.material.uniforms.uTime.value = tm;
      p.water.material.uniforms.uEye.value.copy(camera.position);
      p.water.position.set(p.x, 0, p.z);
      p.sky.position.set(p.x, 0, p.z);

      // HUD
      document.getElementById('g-thr').style.width = Math.max(0, p.thr) * 100 + '%';
      const st = document.getElementById('g-str');
      st.style.width = Math.abs(p.str) * 50 + '%';
      st.style.left = (p.str < 0 ? 50 - Math.abs(p.str) * 50 : 50) + '%';
      document.getElementById('g-spd').textContent = (Math.abs(p.v) / 1000).toFixed(1);
      const capDeg = ((-p.yaw * 180 / Math.PI) % 360 + 360) % 360;
      document.getElementById('g-cap').textContent = Math.round(capDeg) + '°';

      // retour de force : ronflement proportionnel aux gaz, coup sec à l'impact
      p.rumbleT -= dt;
      if (p.rumbleT <= 0) {
        const gp = firstPad();
        if (gp) {
          const hit = p.slam > 0.25;
          rumble(gp, hit ? 0.75 : Math.abs(p.thr) * 0.16,
                     hit ? 0.35 : Math.abs(p.thr) * 0.22, hit ? 130 : 220);
        }
        p.rumbleT = 0.2;
      }
      if (inp.pad !== p.hadPad) { p.hadPad = inp.pad; hudHint(); }
      spinAngle += dt * (6 + Math.abs(p.thr) * 190);
    }

    function setCam(mode) {
      if (!play || play.cam === mode) return;
      play.cam = mode;
      controls.enabled = (mode === 'orbit');
      controls.enableDamping = true;
      setCamLabel();

      hudHint();
    }
    function setCamLabel() {
      const m = play ? play.cam : 'chase';
      document.getElementById('btn-cam').textContent =
        t(m === 'orbit' ? 'hud-orbit' : m === 'onboard' ? 'hud-onboard' : 'hud-chase');
    }
    function hudHint() {
      const pad = play && play.hadPad;
      let base;
      if (pad) base = '🎮 ' + String(pad).slice(0, 46) + ' — ' + t('hud-pad');
      else if (padName) base = t('hud-wake');            // annoncée mais muette
      else base = t('hud-key');
      document.getElementById('hud-hint').textContent = base + t('hud-orb');
    }

    function setPlay(on) {
      if (on === !!play) return;
      if (on) {
        if (guide) setGuide(false);
        setAsm(1); target = null;
        explodeAmount = 0;
        document.getElementById('explode-slider').value = 0;
        document.getElementById('explode-val').textContent = '0%';
        apply();
        const w = buildWorld();
        scene.add(w.water); scene.add(w.sky); scene.add(w.foam); scene.add(w.buoys);
        const oldFog = scene.fog, oldBg = scene.background;
        scene.background = new THREE.Color(0x9fb4c4);
        // le bateau seul embarque : la boîte reste au sec
        const vis = new Map();
        for (const it of items) {
          vis.set(it.obj, it.obj.visible);
          if (it.part.grp === 'g-case') it.obj.visible = false;   // la boîte reste au sec
          else boat.add(it.obj);
        }
        grid.visible = false;
        controls.enabled = false;
        document.body.classList.add('play');
        play = Object.assign(w, {
          x: 0, z: 0, yaw: 0, v: 0, r: 0, prevV: 0, thr: 0, str: 0,
          emit: 0, emitJet: 0, emitSlam: 0, plane: 0, slam: 0, pWave: 0,
          cx: 0, cy: 0.12, hadPad: null, oldFog, oldBg, vis, rumbleT: 0,
          noz: items.find(i => i.part.id === 'nozzle'),
          cam: 'chase', look: new THREE.Vector3()
        });
        controls.target.set(0, 24, 0);
        setCamLabel();
        camGoal = null;
        hudHint();
      } else {
        const p = play; play = null;
        scene.remove(p.water); scene.remove(p.sky); scene.remove(p.foam); scene.remove(p.buoys);
        p.buoys.geometry.dispose(); p.buoys.material.dispose();
        p.water.geometry.dispose(); p.water.material.dispose();
        p.sky.geometry.dispose(); p.sky.material.dispose();
        p.foam.geometry.dispose(); p.foam.material.dispose();
        scene.background = p.oldBg; scene.fog = p.oldFog;
        boat.position.set(0, 0, 0); boat.quaternion.identity();
        for (const it of items) {
          scene.add(it.obj);
          if (p.vis.has(it.obj)) it.obj.visible = p.vis.get(it.obj);
        }
        grid.visible = document.getElementById('chk-grid').checked;
        controls.enabled = true;
        document.body.classList.remove('play');
        apply();
        fitCamera(true);
      }
      document.getElementById('btn-play').textContent = t('b-play');
    }

    const CAM_ORDER = ['chase', 'onboard', 'orbit'];
    document.getElementById('btn-cam').onclick = () => {
      if (!play) return;
      setCam(CAM_ORDER[(CAM_ORDER.indexOf(play.cam) + 1) % CAM_ORDER.length]);
    };
    // toucher la souris passe en orbite : c'est le geste attendu d'un visu 3D
    renderer.domElement.addEventListener('pointerdown', () => { if (play) setCam('orbit'); });
    renderer.domElement.addEventListener('wheel', () => { if (play) setCam('orbit'); }, { passive: true });

    /* ---------------------------------------------------------------- *
     *  SÉLECTION D'UNE PIÈCE AU CLIC
     *  Un clic sans glissé lance un rayon : la pièce touchée est surlignée,
     *  nommée dans le bandeau, et sa ligne remonte dans le panneau. C'est le
     *  chaînon qui manquait entre la liste et la maquette.
     * ---------------------------------------------------------------- */
    const ray = new THREE.Raycaster();
    let selected = null, downAt = null;

    function selectPart(part) {
      if (selected && selected !== part) selected.mat.emissive.setHex(0x000000);
      if (selected === part) part = null;            // re-cliquer désélectionne
      selected = part;
      document.querySelectorAll('#parts-list .chk').forEach(l => {
        l.classList.toggle('sel', !!part && l.querySelector('.nm').dataset.part === part.id);
      });
      if (!part) { phaseEl.classList.remove('on'); return; }
      if (!guide) part.mat.emissive.setHex(0x40210a);
      phaseEl.textContent = part.name[lang] + '  ×' + part.at.length;
      phaseEl.classList.add('on');
      clearTimeout(showPhase.tid);
      const row = [...document.querySelectorAll('#parts-list .chk')]
        .find(l => l.querySelector('.nm').dataset.part === part.id);
      if (row) row.scrollIntoView({ block: 'nearest' });
    }

    renderer.domElement.addEventListener('pointerdown', e => {
      downAt = { x: e.clientX, y: e.clientY };
    });
    renderer.domElement.addEventListener('pointerup', e => {
      if (play || !downAt) return;
      if (Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 4) return;  // c'était un glissé
      const r = renderer.domElement.getBoundingClientRect();
      ray.setFromCamera(new THREE.Vector2(
        ((e.clientX - r.left) / r.width) * 2 - 1,
        -((e.clientY - r.top) / r.height) * 2 + 1), camera);
      const hits = ray.intersectObjects(items.filter(i => i.obj.visible).map(i => i.obj), true);
      if (!hits.length) { selectPart(null); return; }
      let o = hits[0].object;
      const it = items.find(i => i.obj === o || i.obj === o.parent);
      selectPart(it ? it.part : null);
    });

    document.getElementById('parts-search').oninput = filterList;
    document.getElementById('btn-reset').onclick = resetBoat;
    document.getElementById('btn-reset').title = 'R';
    document.getElementById('btn-play').onclick = () => setPlay(true);
    document.getElementById('btn-play-quit').onclick = () => setPlay(false);
    function resetBoat() {
      if (!play) return;
      Object.assign(play, { x: 0, z: 0, yaw: 0, v: 0, r: 0, prevV: 0,
                            thr: 0, str: 0, plane: 0, slam: 0 });
      for (let i = 0; i < play.n; i++) play.life[i] = 0;
      setCam('chase');
    }
    // retour de force : la manette vibre sous les gaz et encaisse les impacts
    function rumble(gp, strong, weak, ms) {
      const a = gp && gp.vibrationActuator;
      if (!a || !a.playEffect) return;
      try { a.playEffect('dual-rumble',
        { duration: ms, strongMagnitude: strong, weakMagnitude: weak }); }
      catch (_) { /* pad sans retour de force : tant pis, ce n'est qu'un bonus */ }
    }

    addEventListener('keydown', e => {
      if (!play) return;
      const k = e.key.toLowerCase();
      if (e.key === 'Escape') setPlay(false);
      else if (k === 'c') setCam(CAM_ORDER[(CAM_ORDER.indexOf(play.cam) + 1) % CAM_ORDER.length]);
      else if (k === 'r') resetBoat();
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      if (play) {
        // en pilotage, stepPlay tient la caméra, la houle et le régime d'hélice
        stepPlay(dt, clock.elapsedTime);
      } else {
        stepAnim(dt);
        stepCam(dt);
        if (spinOn) spinAngle += dt * 12;
        controls.autoRotate = autoRotate;
        controls.update();
      }
      if (play || spinOn) {
        PARTS.forEach(p => {
          if (!p.spin) return;
          p.at.forEach((inst, k) => {
            const e = inst.rot ?? [0, 0, 0];
            if (asm > 0.999) p.objs[k].rotation.set(e[0], e[1], e[2] + spinAngle);
          });
        });
      }
      renderer.render(scene, camera);
    }

    loadAll().then(animate);
  </script>
</body>
</html>
