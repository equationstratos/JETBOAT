<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <title>JETBOAT — Visualiseur 3D</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚤</text></svg>"/>
  <style>
    :root {
      --bg: #0d1117; --panel: #161b22; --border: #30363d;
      --text: #e6edf3; --muted: #8b949e; --accent: #ff5500; --accent2: #f78166;
      --ui-w: 286px
    }
    @media (max-width: 640px) { :root { --ui-w: 250px } }
    * { box-sizing: border-box; margin: 0; padding: 0 }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text) }
    #canvas-wrap { position: absolute; inset: 0 }
    canvas { display: block; width: 100%; height: 100%; touch-action: none }
    /* Le panneau et sa poignée s'escamotent par `transform` seul : la boucle de
       rendu WebGL sature le thread principal, une transition sur `left` ou
       `width` s'y ferait étrangler. `will-change` les isole sur leur propre
       couche de composition, la transition reste donc fluide au montage.     */
    #ui { position: absolute; top: 0; left: 0; bottom: 0; width: var(--ui-w); background: rgba(22,27,34,.94); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 10; overflow-y: auto; will-change: transform; transition: transform .28s cubic-bezier(.4,0,.2,1) }
    body.ui-off #ui { transform: translateX(-100%) }
    #ui-toggle { position: absolute; top: 12px; left: 8px; z-index: 12; width: 30px; height: 30px; padding: 0; display: flex; align-items: center; justify-content: center; font-size: .95rem; line-height: 1; will-change: transform; transform: translateX(var(--ui-w)); transition: transform .28s cubic-bezier(.4,0,.2,1) }
    body.ui-off #ui-toggle { transform: none }
    #ui-toggle .arr { display: block; transition: transform .28s cubic-bezier(.4,0,.2,1) }
    body.ui-off #ui-toggle .arr { transform: rotate(180deg) }
    @media (prefers-reduced-motion: reduce) { #ui, #ui-toggle, #ui-toggle .arr { transition: none } }
    #ui header { padding: 14px 16px 10px; border-bottom: 1px solid var(--border) }
    #ui header h1 { font-size: 1.1rem; font-weight: 700 }
    #ui header p { font-size: .72rem; color: var(--muted); margin-top: 3px }
    .section { padding: 10px 14px; border-bottom: 1px solid var(--border) }
    .section h2 { font-size: .65rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between }
    .btn-row { display: flex; gap: 5px; flex-wrap: wrap }
    button { background: #21262d; border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 6px; font-size: .78rem; cursor: pointer }
    button:hover { background: #30363d }
    button:disabled { opacity: .35; cursor: default }
    button:disabled:hover { background: #21262d }
    button.active { background: var(--accent); border-color: var(--accent); color: #0d1117; font-weight: 600 }
    button.primary { background: var(--accent2); border-color: var(--accent2); color: #0d1117; font-weight: 600; flex: 1 }
    input[type=range] { width: 100%; accent-color: var(--accent) }
    label.chk { display: flex; align-items: center; gap: 7px; font-size: .78rem; padding: 2px 0; cursor: pointer }
    label.chk .qty { margin-left: auto; color: var(--muted); font-size: .68rem; font-variant-numeric: tabular-nums }
    label.chk .sw { width: 9px; height: 9px; border-radius: 2px; flex: none }
    #parts-list { max-height: 300px; overflow-y: auto; padding-right: 2px }
    .grp-title { font-size: .62rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 9px 0 3px }
    .grp-title:first-child { margin-top: 0 }
    #phase { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); background: rgba(22,27,34,.96); border: 1px solid var(--border); border-radius: 10px; padding: 8px 16px; z-index: 20; font-size: .82rem; opacity: 0; transition: opacity .25s; pointer-events: none; white-space: nowrap }
    #phase.on { opacity: 1 }
    body.guide #phase { display: none }

    header h1 .ver { font-size: .62rem; font-weight: 700; letter-spacing: .06em; color: #0d1117; background: var(--accent); border-radius: 4px; padding: 2px 5px; vertical-align: middle; margin-left: 4px }
    #livery-row { display: flex; gap: 7px; margin-bottom: 7px }
    .sw-btn { width: 30px; height: 26px; padding: 0; border-radius: 6px; border: 2px solid transparent; cursor: pointer; flex: none }
    .sw-btn.on { border-color: #f2f5f8; box-shadow: 0 0 0 1px #0d1117 inset }
    #parts-search { width: 100%; margin-bottom: 7px; padding: 5px 8px; font: inherit; font-size: .74rem; color: var(--fg); background: #12171d; border: 1px solid var(--border); border-radius: 6px }
    #parts-search:focus { outline: none; border-color: var(--accent) }
    .chk.sel { background: rgba(255,85,0,.14); border-radius: 5px }
    .chk.hidden-row { display: none }
    .grp-title.hidden-row { display: none }

    /* mode pilotage */
    #hud { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); width: min(560px, calc(100vw - 32px)); background: rgba(12,18,26,.9); border: 1px solid var(--border); border-radius: 12px; z-index: 22; display: none; padding: 10px 13px; backdrop-filter: blur(6px) }
    body.play #hud { display: block }
    body.play #phase, body.play #card { display: none }
    #hud .hrow { display: flex; align-items: center; gap: 13px }
    #hud .gauge { flex: 1; min-width: 0 }
    #hud .gauge label { display: block; font-size: .62rem; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px }
    #hud .bar { position: relative; height: 7px; border-radius: 4px; background: #1d232c; overflow: hidden }
    #hud .bar i { position: absolute; top: 0; bottom: 0; left: 0; width: 0; background: var(--accent); border-radius: 4px }
    #hud .bar.mid i { left: 50%; width: 0 }
    #hud .spd { text-align: right; white-space: nowrap }
    #hud .spd b { font-size: 1.15rem; font-variant-numeric: tabular-nums }
    #hud .spd span { font-size: .62rem; color: var(--muted); margin-left: 3px }
    #hud button { flex: none }
    #hud .hint { margin-top: 8px; font-size: .68rem; line-height: 1.45; color: var(--muted) }
    body.play #ui { display: none }
    body.play #ui-toggle { display: none }

    /* fiche d'étape du guide */
    #card { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); width: min(620px, calc(100vw - 40px)); background: rgba(22,27,34,.97); border: 1px solid var(--border); border-radius: 12px; z-index: 21; display: none; box-shadow: 0 10px 34px rgba(0,0,0,.45) }
    body.guide #card { display: block }
    #card .bar { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--border) }
    #card .bar .num { font-size: .68rem; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; white-space: nowrap }
    #card .bar .ttl { font-weight: 650; font-size: .95rem; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
    #card .bar button { width: 30px; height: 28px; padding: 0; flex: none }
    #card .body { padding: 11px 13px 13px; max-height: 34vh; overflow-y: auto }
    #card .body p { font-size: .82rem; line-height: 1.5 }
    #card .tip { margin-top: 9px; font-size: .76rem; line-height: 1.45; color: #ffd0ad; background: rgba(255,85,0,.09); border-left: 2px solid var(--accent); padding: 7px 10px; border-radius: 0 6px 6px 0 }
    #card .tip b { color: var(--accent2); font-weight: 600 }
    #card .bom { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px }
    #card .bom span { font-size: .72rem; background: #21262d; border: 1px solid var(--border); border-radius: 20px; padding: 3px 9px; display: flex; align-items: center; gap: 6px }
    #card .bom i { width: 8px; height: 8px; border-radius: 2px; display: block }
    #card .prog { height: 3px; background: #21262d; border-radius: 0 0 11px 11px; overflow: hidden }
    #card .prog i { display: block; height: 100%; background: var(--accent); transition: width .3s }
    #lang { position: absolute; top: 10px; right: 10px; z-index: 15; display: flex; gap: 4px }
    #lang button { padding: 4px 9px; font-size: .72rem }
    #loading { position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; transition: opacity .45s }
    #loading.hidden { opacity: 0; pointer-events: none }
    #loading .bar { width: 200px; height: 3px; background: #21262d; border-radius: 2px; margin-top: 14px; overflow: hidden }
    #loading .fill { height: 100%; background: var(--accent); width: 0%; transition: width .2s }
    .note { font-size: .68rem; color: var(--muted); line-height: 1.4; margin-top: 7px }
  </style>
</head>
<body>
  <div id="loading">
    <div style="font-size:1.5rem;font-weight:700">🚤 JETBOAT</div>
    <div style="color:var(--muted);margin-top:6px;font-size:.85rem" id="load-text">Chargement…</div>
    <div class="bar"><div class="fill" id="load-fill"></div></div>
  </div>
  <div id="canvas-wrap"></div>

  <button id="ui-toggle" title="Panneau (P)" aria-controls="ui" aria-expanded="true"><span class="arr">‹</span></button>

  <div id="ui">
    <header>
      <h1>🚤 JETBOAT <span class="ver">v2</span></h1>
      <p>RC Mini Jet Boat · jtronics</p>
    </header>

    <div class="section">
      <h2 data-i18n="h-montage">Montage</h2>
      <div class="btn-row">
        <button id="btn-assemble" class="primary" data-i18n="b-assemble">Assembler</button>
        <button id="btn-disassemble" data-i18n="b-disassemble">Démonter</button>
      </div>
      <h2 style="margin-top:11px"><span data-i18n="h-progress">Progression</span> <span id="asm-val">0%</span></h2>
      <input type="range" id="asm-slider" min="0" max="100" value="0"/>
      <div class="btn-row" style="margin-top:9px">
        <button id="btn-guide" class="primary" data-i18n="b-guide">Guide pas-à-pas</button>
      </div>
      <div class="btn-row" style="margin-top:9px">
        <button id="btn-play" class="primary" data-i18n="b-play">Mode pilotage</button>
      </div>
    </div>

    <div class="section">
      <h2><span data-i18n="h-explode">Éclatement</span> <span id="explode-val">0%</span></h2>
      <input type="range" id="explode-slider" min="0" max="100" value="0"/>
      <div class="note" data-i18n="n-explode">Écarte les pièces depuis le bateau monté.</div>
    </div>

    <div class="section">
      <h2><span data-i18n="h-parts">Pièces</span> <span id="parts-count"></span></h2>
      <div class="btn-row" style="margin-bottom:7px">
        <button id="btn-show-all" style="font-size:.7rem" data-i18n="b-all">Tout</button>
        <button id="btn-hide-all" style="font-size:.7rem" data-i18n="b-none">Masquer</button>
        <button id="btn-fit" style="font-size:.7rem" data-i18n="b-fit">Recadrer</button>
      </div>
      <input id="parts-search" type="search" placeholder="Rechercher…" data-i18n-ph="ph-search"/>
      <div id="parts-list"></div>
    </div>

    <div class="section">
      <h2 data-i18n="h-livery">Livrée</h2>
      <div id="livery-row"></div>
      <div class="note" data-i18n="n-livery">Coque anthracite et flashs de couleur. « Atelier » remet les teintes qui distinguent les pièces au montage.</div>
    </div>

    <div class="section">
      <h2 data-i18n="h-display">Affichage</h2>
      <label class="chk"><input type="checkbox" id="chk-wire"/> <span data-i18n="c-wire">Filaire</span></label>
      <label class="chk"><input type="checkbox" id="chk-auto"/> <span data-i18n="c-auto">Auto-rotation</span></label>
      <label class="chk"><input type="checkbox" id="chk-grid" checked/> <span data-i18n="c-grid">Plan de travail</span></label>
      <label class="chk"><input type="checkbox" id="chk-spin" checked/> <span data-i18n="c-spin">Hélice animée</span></label>
    </div>
  </div>

  <div id="phase"></div>

  <div id="hud">
    <div class="hrow">
      <div class="gauge"><label data-i18n="hud-thr">Gaz</label><div class="bar"><i id="g-thr"></i></div></div>
      <div class="gauge"><label data-i18n="hud-str">Barre</label><div class="bar mid"><i id="g-str"></i></div></div>
      <div class="spd"><b id="g-spd">0.0</b><span>m/s</span></div>
      <div class="spd"><b id="g-cap">0°</b><span data-i18n="hud-cap">Cap</span></div>
      <button id="btn-reset" title="R">↺</button>
      <button id="btn-cam" data-i18n="hud-chase">Poursuite</button>
      <button id="btn-play-quit" data-i18n="hud-quit">Quitter</button>
    </div>
    <div class="hint" id="hud-hint"></div>
  </div>

  <div id="card">
    <div class="bar">
      <button id="st-prev" title="←">◀</button>
      <span class="num" id="st-num"></span>
      <span class="ttl" id="st-title"></span>
      <button id="st-next" title="→">▶</button>
      <button id="st-quit" title="Esc">✕</button>
    </div>
    <div class="body">
      <p id="st-desc"></p>
      <div class="bom" id="st-bom"></div>
      <div class="tip"><b id="st-tiplabel"></b> <span id="st-tip"></span></div>
    </div>
    <div class="prog"><i id="st-prog"></i></div>
  </div>

  <div id="lang">
    <button id="btn-fr" class="active">FR</button>
    <button id="btn-en">EN</button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { STLLoader } from 'three/addons/loaders/STLLoader.js';

    /* ------------------------------------------------------------------ *
     *  REPÈRE
     *  Tout est décrit dans le repère de boat_hull.STL (mm) :
     *    X = travers (0 bâbord … 94 tribord, axe du bateau à X = 47)
     *    Y = hauteur (quille ≈ 3.8, pont ≈ 39.6)
     *    Z = longueur (tableau arrière à 0.05, étrave à 200)
     *  G recentre l'ensemble : origine au milieu de la coque, quille à Y = 0.
     * ------------------------------------------------------------------ */
    const G = new THREE.Vector3(-47, -3.79, -100);

    /* Repères relevés dans les maillages et réutilisés ci-dessous :
         tableau arrière plan ....................... Z = 0.054
         axe du jet ................................. X = 47, Y = 18.9
         rotule du stator ........................... Z = -13.29
         portée du couvercle (haut des bossages) .... Y = 39.6
         tablette du support RC ..................... Y = 29.4
         tablette du servo .......................... Y = 31.57
         perçages moteur (entraxe 16) ............... X = 39 / 55, Z = 106
         chambre à graisse de l'arbre ............... Z = 58 … 76, Ø 2.78
         sièges de paliers Ø5 ....................... Z ≈ 56 et 77            */

    const T = {
      fr: {
        'h-montage':'Montage','b-assemble':'Assembler','b-disassemble':'Démonter',
        'h-progress':'Progression','h-explode':'Éclatement','h-parts':'Pièces',
        'b-all':'Tout','b-none':'Masquer','b-fit':'Recadrer','h-display':'Affichage',
        'c-wire':'Filaire','c-auto':'Auto-rotation','c-grid':'Plan de travail','c-spin':'Hélice animée',
        'n-explode':'Écarte les pièces depuis le bateau monté.',
        'g-print':'Pièces imprimées','g-drive':'Transmission','g-elec':'Électronique',
        'g-fix':'Visserie & joints','g-case':'Boîte de rangement',
        'h-guide':'Guide de montage','b-guide':'Guide pas-à-pas','b-quit':'Quitter le guide',
        'b-play':'Mode pilotage','h-livery':'Livrée',
        'n-livery':'Coque anthracite et flashs de couleur. « Atelier » remet les teintes qui distinguent les pièces au montage.','ph-search':'Rechercher une pièce…','sel-none':'Aucune pièce ici','hud-thr':'Gaz','hud-str':'Barre','hud-quit':'Quitter',
        'hud-pad':'stick gauche = barre · R2 = gaz · L2 = arrière · stick droit = caméra · ✕ = poursuite',
        'hud-key':'↑/↓ = gaz · ←/→ = barre · C = caméra · R = remise à l’eau · Échap = quitter — manette branchée mais muette ? Cliquez dans la page puis pressez une touche du pad : le navigateur ne la révèle qu’au premier appui.',
        'hud-wake':'Manette reconnue — appuyez sur une touche du pad pour l’activer.',
        'hud-orb':'',
        'hud-chase':'Poursuite','hud-orbit':'Orbite','hud-onboard':'Embarquée',
        'hud-cap':'Cap','hud-reset':'Remettre à l’eau (R)',
        'g-step':'Étape','g-of':'sur','g-bom':'Pièces de l’étape','g-tip':'À surveiller',
        'ph-flat':'Pièces à plat','ph-done':'Bateau monté',
        'ui-hide':'Masquer le panneau (P)','ui-show':'Afficher le panneau (P)'
      },
      en: {
        'h-montage':'Assembly','b-assemble':'Assemble','b-disassemble':'Take apart',
        'h-progress':'Progress','h-explode':'Explode','h-parts':'Parts',
        'b-all':'All','b-none':'Hide','b-fit':'Re-frame','h-display':'Display',
        'c-wire':'Wireframe','c-auto':'Auto-rotate','c-grid':'Workbench','c-spin':'Spin impeller',
        'n-explode':'Spreads the parts out from the assembled boat.',
        'g-print':'Printed parts','g-drive':'Drivetrain','g-elec':'Electronics',
        'g-fix':'Fasteners & seals','g-case':'Storage case',
        'h-guide':'Build guide','b-guide':'Step-by-step','b-quit':'Leave guide',
        'b-play':'Drive it','h-livery':'Livery',
        'n-livery':'Anthracite hull with colour flashes. “Workshop” restores the tints that tell the parts apart during assembly.','ph-search':'Search a part…','sel-none':'No part here','hud-thr':'Throttle','hud-str':'Steering','hud-quit':'Exit',
        'hud-pad':'left stick steers · R2 throttle · L2 reverse · right stick camera · ✕ back to chase',
        'hud-key':'↑/↓ throttle · ←/→ steering · C camera · R reset · Esc to exit — gamepad plugged in but silent? Click in the page, then press a button on the pad: the browser only reveals it on the first press.',
        'hud-wake':'Gamepad recognised — press a button on the pad to activate it.',
        'hud-orb':' · Mouse: drag to orbit, wheel to zoom — the camera keeps following the boat. C returns to chase.',
        'hud-chase':'Chase','hud-orbit':'Orbit','hud-onboard':'Onboard',
        'hud-cap':'Heading','hud-reset':'Reset to start (R)',
        'g-step':'Step','g-of':'of','g-bom':'Parts for this step','g-tip':'Watch out',
        'ph-flat':'Parts laid out','ph-done':'Boat assembled',
        'ui-hide':'Hide panel (P)','ui-show':'Show panel (P)'
      }
    };
    let lang = 'fr';
    const t = k => (T[lang][k] ?? k);

    /* ------------------------------------------------------------------ *
     *  GÉOMÉTRIES PARAMÉTRIQUES (quincaillerie & électronique)
     *  Convention : construites autour de +Y, origine au point d'appui.
     * ------------------------------------------------------------------ */
    const cyl = (d, h, seg = 20) => new THREE.CylinderGeometry(d / 2, d / 2, h, seg);
    const cylX = (d, h, seg = 16) => cyl(d, h, seg).rotateZ(Math.PI / 2);
    const cylZ = (d, h, seg = 16) => cyl(d, h, seg).rotateX(Math.PI / 2);
    const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
    const at = (g, x, y, z) => { g.translate(x, y, z); return g; };

    // vis à tête cylindrique : origine sous la tête, tige vers -Y
    function screwGeo(len, shaftD = 2, headD = null, headH = null) {
      const hd = headD ?? shaftD * 1.9, hh = headH ?? shaftD * 0.8;
      return [at(cyl(hd, hh), 0, hh / 2, 0), at(cyl(shaftD, len), 0, -len / 2, 0)];
    }
    // vis sans tête : origine à l'entrée du trou, corps vers -Y
    const grubGeo = (len = 3) => [at(cyl(2, len, 14), 0, -len / 2, 0)];
    // insert laiton chauffant M2x3 : origine sur le dessus du bossage
    const insertGeo = () => [at(cyl(3.2, 3, 18), 0, -1.5, 0), at(cyl(3.6, .5, 18), 0, -.25, 0)];
    // tube (palier, entretoise) : origine au centre
    const tubeGeo = (od, len) => [cyl(od, len, 18)];

    function batteryGeo() {                       // 18650 : Ø18.6 × 65
      return [cyl(18.6, 65, 26), at(cyl(8, 1.6, 16), 0, 33.3, 0), at(cyl(17, .8, 26), 0, -32.9, 0)];
    }
    function motorGeo() {                         // DYS BE1806 : Ø23 × 18, origine = face d'appui
      return [at(cyl(23, 13, 26), 0, 11.5, 0), at(cyl(20, 4, 26), 0, 3, 0),
              at(box(19, 1.2, 5), 0, .6, 0), at(box(5, 1.2, 19), 0, .6, 0)];
    }
    /* GOTECK GS-2502 « Nano servo » : 16.0 × 8.0 × 20.0 mm, 2.2 g.
       Couché sur le flanc, comme sur la photo de montage : la longueur (16)
       dans la longueur du bateau, la hauteur (20) en travers, l'épaisseur (8)
       à la verticale.
       Il ne se pose PAS sur la baie : celle-ci n'est pas une tablette pleine
       mais quatre nervures de 0.7 mm qui montent du toit du tunnel d'arbre
       (y = 23.55) jusqu'à y = 31.57. jtronics les coupe au cutter dans sa
       vidéo de montage pour que le servo descende au fond — c'est ce que fait
       tools/hull_servo_pocket.py, d'où models/boat_hull_cut.STL. Le boîtier
       repose donc sur le toit du tunnel et son dessus affleure les talons de
       nervure restants, à 31.55 pour 31.57.
       Les languettes du servo sont coupées elles aussi, et les deux vis M2×6
       ne le vissent pas : elles l'encadrent devant et derrière et le calent.
       Forme d'origine conservée : boîtier, moyeu de sortie, corne.
       Origine = toit du tunnel d'arbre.                                     */
    function servoGeo() {
