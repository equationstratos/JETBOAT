<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JETBOAT — Visualiseur 3D RC Mini Jet Boat</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --accent2: #f78166;
      --green: #3fb950;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
    #canvas-wrap { position: absolute; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    #ui {
      position: absolute; top: 0; left: 0; bottom: 0; width: 320px;
      background: rgba(22,27,34,0.92); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; backdrop-filter: blur(8px);
      z-index: 10;
    }
    #ui header {
      padding: 16px 18px 12px; border-bottom: 1px solid var(--border);
    }
    #ui header h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.02em; }
    #ui header p { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }
    .section { padding: 12px 16px; border-bottom: 1px solid var(--border); }
    .section h2 { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 10px; }
    .btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
    button, .btn {
      background: #21262d; border: 1px solid var(--border); color: var(--text);
      padding: 7px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    button:hover, .btn:hover { background: #30363d; border-color: #8b949e; }
    button.active { background: var(--accent); border-color: var(--accent); color: #0d1117; font-weight: 600; }
    button.primary { background: var(--accent2); border-color: var(--accent2); color: #0d1117; font-weight: 600; }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    label.chk { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; padding: 4px 0; cursor: pointer; }
    label.chk input { accent-color: var(--accent); }
    #parts-list { max-height: 220px; overflow-y: auto; }
    #parts-list label { padding: 3px 0; }
    .step-bar {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(22,27,34,0.95); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 20px; display: none; align-items: center; gap: 16px; z-index: 20;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .step-bar.visible { display: flex; }
    .step-bar .info { min-width: 200px; text-align: center; }
    .step-bar .info strong { display: block; font-size: 0.95rem; }
    .step-bar .info span { font-size: 0.75rem; color: var(--muted); }
    #lang { position: absolute; top: 12px; right: 12px; z-index: 15; }
    #lang button { padding: 4px 10px; font-size: 0.75rem; }
    .view-pad {
      position: absolute; bottom: 20px; left: 340px; z-index: 15;
      display: grid; grid-template-columns: repeat(3, 36px); gap: 4px;
    }
    .view-pad button { width: 36px; height: 36px; padding: 0; font-size: 0.7rem; }
    #loading {
      position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 100; transition: opacity .4s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading .bar { width: 220px; height: 4px; background: #21262d; border-radius: 2px; margin-top: 16px; overflow: hidden; }
    #loading .fill { height: 100%; background: var(--accent); width: 0%; transition: width .2s; }
    #toast {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      background: #21262d; border: 1px solid var(--border); padding: 8px 16px; border-radius: 8px;
      font-size: 0.85rem; opacity: 0; transition: opacity .3s; z-index: 50; pointer-events: none;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="loading">
    <div style="font-size:1.4rem;font-weight:700">JETBOAT</div>
    <div style="color:var(--muted);margin-top:6px;font-size:0.85rem">Chargement des modèles 3D…</div>
    <div class="bar"><div class="fill" id="load-fill"></div></div>
  </div>
  <div id="toast"></div>
  <div id="canvas-wrap"></div>

  <div id="ui">
    <header>
      <h1>🚤 JETBOAT</h1>
      <p>RC Mini Jet Boat · jtronics · Visualiseur 3D</p>
    </header>

    <div class="section">
      <h2>Mode</h2>
      <div class="btn-row">
        <button id="btn-assembled" class="active">Assemblé</button>
        <button id="btn-exploded">Éclaté</button>
        <button id="btn-build" class="primary">Build pas-à-pas</button>
      </div>
    </div>

    <div class="section" id="explode-section">
      <h2>Éclatement <span id="explode-val">0%</span></h2>
      <input type="range" id="explode-slider" min="0" max="100" value="0" />
    </div>

    <div class="section">
      <h2>Arbre d'assemblage</h2>
      <div class="btn-row" style="margin-bottom:8px">
        <button id="btn-show-all" style="font-size:0.72rem">Tout afficher</button>
        <button id="btn-hide-all" style="font-size:0.72rem">Tout masquer</button>
      </div>
      <div id="parts-list"></div>
    </div>

    <div class="section">
      <h2>Affichage</h2>
      <label class="chk"><input type="checkbox" id="chk-wire" /> Mode filaire</label>
      <label class="chk"><input type="checkbox" id="chk-auto" /> Auto-rotation</label>
      <label class="chk"><input type="checkbox" id="chk-edges" /> Arêtes</label>
      <div style="margin-top:10px">
        <label style="font-size:0.75rem;color:var(--muted)">Fond</label>
        <div class="btn-row" style="margin-top:4px">
          <button data-bg="#0d1117" class="bg-btn active">Sombre</button>
          <button data-bg="#1a2332" class="bg-btn">Bleu</button>
          <button data-bg="#f0f0f0" class="bg-btn">Clair</button>
        </div>
      </div>
    </div>

    <div class="section" style="margin-top:auto;border-bottom:none">
      <h2>Infos modèle</h2>
      <p style="font-size:0.78rem;color:var(--muted);line-height:1.45">
        RC Mini Jet Boat · 230 × 75 × 50 mm<br>
        Impression 3D PLA · Jet drive intégré<br>
        Source : <a href="https://cults3d.com/en/users/jtronics/creations" target="_blank" style="color:var(--accent)">jtronics / Cults3D</a>
      </p>
    </div>
  </div>

  <div class="view-pad">
    <button data-view="iso">ISO</button>
    <button data-view="top">↑</button>
    <button data-view="reset">↺</button>
    <button data-view="left">←</button>
    <button data-view="front">●</button>
    <button data-view="right">→</button>
    <span></span>
    <button data-view="bottom">↓</button>
    <span></span>
  </div>

  <div class="step-bar" id="step-bar">
    <button id="step-prev">◀ Préc.</button>
    <div class="info">
      <strong id="step-title">Étape 1</strong>
      <span id="step-desc">Description</span>
    </div>
    <button id="step-next">Suiv. ▶</button>
  </div>

  <div id="lang">
    <button id="btn-fr" class="active">FR</button>
    <button id="btn-en">EN</button>
  </div>

  <script type="module">
    // Full visualizer code is in the local artifacts/JETBOAT/index.html
    // Please download the full file from the conversation artifacts or clone and replace.
    // This is a placeholder - the complete interactive viewer with Three.js is ready locally.
    document.getElementById('loading').innerHTML = '<div style="text-align:center"><h2>JETBOAT</h2><p>Le visualiseur complet est disponible dans les artifacts locaux.<br>Clonez le repo et ajoutez les modèles GLB depuis /home/workdir/artifacts/JETBOAT</p></div>';
  </script>
</body>
</html>
