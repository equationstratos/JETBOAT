<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <title>JETBOAT — Visualiseur 3D</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚤</text></svg>"/>
  <style>
    :root {
      --bg: #0d1117; --panel: #161b22; --border: #30363d;
      --text: #e6edf3; --muted: #8b949e; --accent: #ff5500; --accent2: #f78166
    }
    * { box-sizing: border-box; margin: 0; padding: 0 }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text) }
    #canvas-wrap { position: absolute; inset: 0 }
    canvas { display: block; width: 100%; height: 100%; touch-action: none }
    #ui { position: absolute; top: 0; left: 0; bottom: 0; width: 286px; background: rgba(22,27,34,.94); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 10; overflow-y: auto }
    #ui header { padding: 14px 16px 10px; border-bottom: 1px solid var(--border) }
    #ui header h1 { font-size: 1.1rem; font-weight: 700 }
    #ui header p { font-size: .72rem; color: var(--muted); margin-top: 3px }
    .section { padding: 10px 14px; border-bottom: 1px solid var(--border) }
    .section h2 { font-size: .65rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between }
    .btn-row { display: flex; gap: 5px; flex-wrap: wrap }
    button { background: #21262d; border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 6px; font-size: .78rem; cursor: pointer }
    button:hover { background: #30363d }
    button.active { background: var(--accent); border-color: var(--accent); color: #0d1117; font-weight: 600 }
    button.primary { background: var(--accent2); border-color: var(--accent2); color: #0d1117; font-weight: 600; flex: 1 }
    input[type=range] { width: 100%; accent-color: var(--accent) }
    label.chk { display: flex; align-items: center; gap: 7px; font-size: .78rem; padding: 2px 0; cursor: pointer }
    label.chk .qty { margin-left: auto; color: var(--muted); font-size: .68rem; font-variant-numeric: tabular-nums }
    label.chk .sw { width: 9px; height: 9px; border-radius: 2px; flex: none }
    #parts-list { max-height: 300px; overflow-y: auto; padding-right: 2px }
    .grp-title { font-size: .62rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 9px 0 3px }
    .grp-title:first-child { margin-top: 0 }
    #phase { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); background: rgba(22,27,34,.96); border: 1px solid var(--border); border-radius: 10px; padding: 8px 16px; z-index: 20; font-size: .82rem; opacity: 0; transition: opacity .25s; pointer-events: none; white-space: nowrap }
    #phase.on { opacity: 1 }
    #lang { position: absolute; top: 10px; right: 10px; z-index: 15; display: flex; gap: 4px }
    #lang button { padding: 4px 9px; font-size: .72rem }
    #loading { position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; transition: opacity .45s }
    #loading.hidden { opacity: 0; pointer-events: none }
    #loading .bar { width: 200px; height: 3px; background: #21262d; border-radius: 2px; margin-top: 14px; overflow: hidden }
    #loading .fill { height: 100%; background: var(--accent); width: 0%; transition: width .2s }
    .note { font-size: .68rem; color: var(--muted); line-height: 1.4; margin-top: 7px }
  </style>
</head>
<body>
  <div id="loading">
    <div style="font-size:1.5rem;font-weight:700">🚤 JETBOAT</div>
    <div style="color:var(--muted);margin-top:6px;font-size:.85rem" id="load-text">Chargement…</div>
    <div class="bar"><div class="fill" id="load-fill"></div></div>
  </div>
  <div id="canvas-wrap"></div>

  <div id="ui">
    <header>
      <h1>🚤 JETBOAT</h1>
      <p>RC Mini Jet Boat · jtronics</p>
    </header>

    <div class="section">
      <h2 data-i18n="h-montage">Montage</h2>
      <div class="btn-row">
        <button id="btn-assemble" class="primary" data-i18n="b-assemble">Assembler</button>
        <button id="btn-disassemble" data-i18n="b-disassemble">Démonter</button>
      </div>
      <h2 style="margin-top:11px"><span data-i18n="h-progress">Progression</span> <span id="asm-val">0%</span></h2>
      <input type="range" id="asm-slider" min="0" max="100" value="0"/>
    </div>

    <div class="section">
      <h2><span data-i18n="h-explode">Éclatement</span> <span id="explode-val">0%</span></h2>
      <input type="range" id="explode-slider" min="0" max="100" value="0"/>
      <div class="note" data-i18n="n-explode">Écarte les pièces depuis le bateau monté.</div>
    </div>

    <div class="section">
      <h2><span data-i18n="h-parts">Pièces</span> <span id="parts-count"></span></h2>
      <div class="btn-row" style="margin-bottom:7px">
        <button id="btn-show-all" style="font-size:.7rem" data-i18n="b-all">Tout</button>
        <button id="btn-hide-all" style="font-size:.7rem" data-i18n="b-none">Masquer</button>
        <button id="btn-fit" style="font-size:.7rem" data-i18n="b-fit">Recadrer</button>
      </div>
      <div id="parts-list"></div>
    </div>

    <div class="section">
      <h2 data-i18n="h-display">Affichage</h2>
      <label class="chk"><input type="checkbox" id="chk-wire"/> <span data-i18n="c-wire">Filaire</span></label>
      <label class="chk"><input type="checkbox" id="chk-auto"/> <span data-i18n="c-auto">Auto-rotation</span></label>
      <label class="chk"><input type="checkbox" id="chk-grid" checked/> <span data-i18n="c-grid">Plan de travail</span></label>
      <label class="chk"><input type="checkbox" id="chk-spin" checked/> <span data-i18n="c-spin">Hélice animée</span></label>
    </div>
  </div>

  <div id="phase"></div>

  <div id="lang">
    <button id="btn-fr" class="active">FR</button>
    <button id="btn-en">EN</button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { STLLoader } from 'three/addons/loaders/STLLoader.js';

    /* ------------------------------------------------------------------ *
     *  REPÈRE
     *  Tout est décrit dans le repère de boat_hull.STL (mm) :
     *    X = travers (0 bâbord … 94 tribord, axe du bateau à X = 47)
     *    Y = hauteur (quille ≈ 3.8, pont ≈ 39.6)
     *    Z = longueur (tableau arrière à 0.05, étrave à 200)
     *  G recentre l'ensemble : origine au milieu de la coque, quille à Y = 0.
     * ------------------------------------------------------------------ */
    const G = new THREE.Vector3(-47, -3.79, -100);

    /* Repères relevés dans les maillages et réutilisés ci-dessous :
         tableau arrière plan ....................... Z = 0.054
         axe du jet ................................. X = 47, Y = 18.9
         rotule du stator ........................... Z = -13.29
         portée du couvercle (haut des bossages) .... Y = 39.6
         tablette du support RC ..................... Y = 29.4
         tablette du servo .......................... Y = 31.57
         perçages moteur (entraxe 16) ............... X = 39 / 55, Z = 106
         chambre à graisse de l'arbre ............... Z = 58 … 76, Ø 2.78
         sièges de paliers Ø5 ....................... Z ≈ 56 et 77            */

    const T = {
      fr: {
        'h-montage':'Montage','b-assemble':'Assembler','b-disassemble':'Démonter',
        'h-progress':'Progression','h-explode':'Éclatement','h-parts':'Pièces',
        'b-all':'Tout','b-none':'Masquer','b-fit':'Recadrer','h-display':'Affichage',
        'c-wire':'Filaire','c-auto':'Auto-rotation','c-grid':'Plan de travail','c-spin':'Hélice animée',
        'n-explode':'Écarte les pièces depuis le bateau monté.',
        'g-print':'Pièces imprimées','g-drive':'Transmission','g-elec':'Électronique',
        'g-fix':'Visserie & joints',
        'ph-flat':'Pièces à plat','ph-done':'Bateau monté'
      },
      en: {
        'h-montage':'Assembly','b-assemble':'Assemble','b-disassemble':'Take apart',
        'h-progress':'Progress','h-explode':'Explode','h-parts':'Parts',
        'b-all':'All','b-none':'Hide','b-fit':'Re-frame','h-display':'Display',
        'c-wire':'Wireframe','c-auto':'Auto-rotate','c-grid':'Workbench','c-spin':'Spin impeller',
        'n-explode':'Spreads the parts out from the assembled boat.',
        'g-print':'Printed parts','g-drive':'Drivetrain','g-elec':'Electronics',
        'g-fix':'Fasteners & seals',
        'ph-flat':'Parts laid out','ph-done':'Boat assembled'
      }
    };
    let lang = 'fr';
    const t = k => (T[lang][k] ?? k);

    /* ------------------------------------------------------------------ *
     *  GÉOMÉTRIES PARAMÉTRIQUES (quincaillerie & électronique)
     *  Convention : construites autour de +Y, origine au point d'appui.
     * ------------------------------------------------------------------ */
    const cyl = (d, h, seg = 20) => new THREE.CylinderGeometry(d / 2, d / 2, h, seg);
    const cylX = (d, h, seg = 16) => cyl(d, h, seg).rotateZ(Math.PI / 2);
    const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
    const at = (g, x, y, z) => { g.translate(x, y, z); return g; };

    // vis à tête cylindrique : origine sous la tête, tige vers -Y
    function screwGeo(len, shaftD = 2, headD = null, headH = null) {
      const hd = headD ?? shaftD * 1.9, hh = headH ?? shaftD * 0.8;
      return [at(cyl(hd, hh), 0, hh / 2, 0), at(cyl(shaftD, len), 0, -len / 2, 0)];
    }
    // vis sans tête : origine à l'entrée du trou, corps vers -Y
    const grubGeo = (len = 3) => [at(cyl(2, len, 14), 0, -len / 2, 0)];
    // insert laiton chauffant M2x3 : origine sur le dessus du bossage
    const insertGeo = () => [at(cyl(3.2, 3, 18), 0, -1.5, 0), at(cyl(3.6, .5, 18), 0, -.25, 0)];
    // tube (palier, entretoise) : origine au centre
    const tubeGeo = (od, len) => [cyl(od, len, 18)];

    function batteryGeo() {                       // 18650 : Ø18.6 × 65
      return [cyl(18.6, 65, 26), at(cyl(8, 1.6, 16), 0, 33.3, 0), at(cyl(17, .8, 26), 0, -32.9, 0)];
    }
    function motorGeo() {                         // DYS BE1806 : Ø23 × 18, origine = face d'appui
      return [at(cyl(23, 13, 26), 0, 11.5, 0), at(cyl(20, 4, 26), 0, 3, 0),
              at(box(19, 1.2, 5), 0, .6, 0), at(box(5, 1.2, 19), 0, .6, 0)];
    }
    /* Micro servo 2 g, couché sur le flanc (cf. photo de montage jtronics) :
       axe long selon Z (avant-arrière), pattes débordant à l'avant et à
       l'arrière — leurs 2 perçages sont bien distants de 19.5 mm en Z sur la
       tablette —, épaisseur 8.6 mm à la verticale, et arbre de sortie
       horizontal pointant vers bâbord : la corne balaie donc le plan vertical
       longitudinal et pousse la tringle d'avant en arrière.
       Origine = dessous des pattes, sur la tablette.                        */
    function servoGeo() {
      return [at(box(16, 8.6, 15.5), -1, 5.9, 0),         // corps
              at(box(11, 1.6, 23), 0, .8, 0),             // pattes de fixation
              at(cylX(5, 3), -10.5, 5.9, -4.5),           // moyeu de sortie
              at(cylX(8, 1.2), -12.6, 5.9, -4.5),         // corne
              at(box(1.8, 6, 1.8), -12.6, 3.2, -4.5)];    // bras de corne
    }
    function couplerGeo() { return [cyl(6, 12, 20), at(cyl(6.6, 1, 20), 0, 4, 0), at(cyl(6.6, 1, 20), 0, -4, 0)]; }
    const escGeo = () => [box(12, 4.5, 25), at(box(9, 2, 6), 0, 2.6, -14)];
    const becGeo = () => [at(box(11.5, 17.5, 8.5), 0, 8.75, 0)];
    const rxGeo  = () => [box(13, 4, 22), at(cyl(1, 22, 8), 5, 3, 4)];

    // câble / cordon : polyligne (repère coque) → tube
    function pathGeo(pts, r, closed = false, seg = null) {
      const c = new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(...p)), closed, 'catmullrom', .3);
      return [new THREE.TubeGeometry(c, seg ?? Math.max(24, pts.length * 3), r, 10, closed)];
    }

    // contour de la portée du couvercle, relevé sur boat_cover.STL (x , z), à Y = 39.6
    const SEAL_XZ = [[18.21,35.34],[18.21,39.43],[18.21,43.52],[18.21,47.6],[18.21,51.69],[18.21,55.78],[18.21,59.86],[18.21,63.95],[18.21,68.04],[18.21,72.13],[18.21,76.21],[18.21,80.3],[18.21,84.39],[18.21,88.47],[18.21,92.56],[18.26,96.65],[18.66,100.71],[19.44,104.72],[20.6,108.64],[22.14,112.43],[24.02,116.05],[26.24,119.48],[28.79,122.67],[31.62,125.61],[34.73,128.27],[38.07,130.62],[41.63,132.62],[45.37,134.28],[49.04,134.12],[52.76,132.42],[56.29,130.37],[59.62,128.0],[62.69,125.3],[65.5,122.34],[68.01,119.11],[70.2,115.66],[72.05,112.02],[73.53,108.22],[74.66,104.29],[75.4,100.27],[75.75,96.2],[75.78,92.11],[75.78,88.03],[75.78,83.94],[75.78,79.85],[75.78,75.76],[75.78,71.68],[75.78,67.59],[75.78,63.5],[75.78,59.42],[75.78,55.33],[75.78,51.24],[75.78,47.15],[75.78,43.07],[75.78,38.98],[75.76,34.89],[74.77,30.95],[72.45,27.61],[69.11,25.3],[65.16,24.32],[61.08,24.3],[56.99,24.3],[52.9,24.3],[48.82,24.3],[44.73,24.3],[40.64,24.3],[36.55,24.3],[32.47,24.3],[28.38,24.36],[24.48,25.49],[21.23,27.94],[19.05,31.36]];
    const sealGeo = () => pathGeo(SEAL_XZ.map(([x, z]) => [x, 39.6, z]), 1, true, 260);

    const wireGeo = () => [
      ...pathGeo([[25.9,31,32],[30,33,50],[35,36,66],[37,37.5,76]], .7),
      ...pathGeo([[68.1,31,32],[60,33,50],[45,36,66],[38,37.5,76]], .7),
      ...pathGeo([[37,37.5,88],[41,30,98],[45,23,104],[47,21,106]], .7),
      ...pathGeo([[57,37,70],[54,39,58],[50,42,50],[48.6,44,44]], .7)
    ].flat();

    const R2 = Math.PI / 2;

    /* ------------------------------------------------------------------ *
     *  NOMENCLATURE — chaque entrée = une ligne d'inventaire,
     *  `at` liste les positions de montage (repère coque).
     * ------------------------------------------------------------------ */
    const PARTS = [
      { id:'hull', grp:'g-print', name:{fr:'Coque',en:'Hull'}, file:'boat_hull.STL',
        color:0xf4520c, lay:'up', explode:[0,0,0], at:[{pos:[0,0,0]}] },

      { id:'ins', grp:'g-fix', name:{fr:'Inserts laiton M2×3',en:'M2×3 brass inserts'},
        geo:insertGeo, color:0xc9a227, lay:'up',
        at:[{pos:[22,39.6,113.2]},{pos:[72,39.6,113.2]},{pos:[24.5,39.6,25]},{pos:[69.5,39.6,25]},
            {pos:[47,29.4,63.6]},{pos:[47,29.4,103.6]}] },

      { id:'bearing', grp:'g-drive', name:{fr:'Paliers laiton Ø5 (52B)',en:'Brass bearings Ø5 (52B)'},
        geo:()=>tubeGeo(5,2.4), color:0xc9a227, lay:'flat',
        at:[{pos:[47,18.9,56.8], rot:[R2,0,0]}, {pos:[47,18.9,77.2], rot:[R2,0,0]}] },

      { id:'jetbush', grp:'g-drive', name:{fr:'Palier de jet, tube laiton Ø3×3',en:'Jet bush, brass tube Ø3×3'},
        geo:()=>tubeGeo(3,3), color:0xc9a227, lay:'flat', at:[{pos:[47,18.9,-1.45], rot:[R2,0,0]}] },

      { id:'servotube', grp:'g-elec', name:{fr:'Tube laiton servo Ø2×10',en:'Servo brass tube Ø2×10'},
        geo:()=>tubeGeo(2,10), color:0xc9a227, lay:'flat', at:[{pos:[37.2,33.4,0.054], rot:[R2,0,0]}] },

      { id:'motor', grp:'g-drive', name:{fr:'Moteur brushless BE1806',en:'BE1806 brushless motor'},
        geo:motorGeo, color:0x8d939b, lay:'flat', at:[{pos:[47,18.9,106], rot:[R2,0,0]}] },

      { id:'mshaft', grp:'g-drive', name:{fr:'Arbre moteur Ø2×30',en:'Motor shaft Ø2×30'},
        geo:()=>tubeGeo(2,30), color:0xb9bec4, lay:'flat', at:[{pos:[47,18.9,106], rot:[R2,0,0]}] },

      { id:'coupler', grp:'g-drive', name:{fr:'Accouplement 2 mm / 2 mm',en:'Shaft coupler 2/2 mm'},
        geo:couplerGeo, color:0x9099a3, lay:'flat', at:[{pos:[47,18.9,91], rot:[R2,0,0]}] },

      { id:'rod', grp:'g-drive', name:{fr:'Tige d’entraînement Ø2×100',en:'Drive rod Ø2×100'},
        geo:()=>tubeGeo(2,100), color:0xb9bec4, lay:'flat', at:[{pos:[47,18.9,41], rot:[R2,0,0]}] },

      { id:'prop', grp:'g-print', name:{fr:'Hélice (impulseur)',en:'Impeller'},
        file:'models/jet_propeller.STL', pivot:[9.85,9.85,0], color:0x9aa0a6, lay:'up',
        spin:true, explode:[0,34,-26], at:[{pos:[47,18.9,0.35]}] },

      { id:'stator', grp:'g-print', name:{fr:'Stator jet',en:'Jet stator'},
        file:'models/jet_stator.STL', color:0x1c1c1e, lay:'up', explode:[0,0,-42],
        at:[{pos:[28.16,37.74,0.054], rot:[Math.PI,0,0]}] },

      { id:'nozzle', grp:'g-print', name:{fr:'Tuyère orientable',en:'Steering nozzle'},
        file:'models/jet_nozzle.STL', color:0x1c1c1e, lay:'up', explode:[0,0,-84],
        at:[{pos:[59.32,4.91,-11.286], rot:[0,Math.PI,0]}] },

      { id:'clevis', grp:'g-print', name:{fr:'Chape de servo',en:'Servo clevis'},
        file:'models/servo_clevis.STL', color:0x2a2a2e, lay:'up', explode:[0,34,-34],
        at:[{pos:[34.80,28.65,-16.29], rot:[-R2,0,-R2]}] },

      { id:'servorod', grp:'g-elec', name:{fr:'Tringle de servo Ø1',en:'Servo pushrod Ø1'},
        geo:()=>pathGeo([[36.0,34.3,42.3],[36.6,33.9,26],[37.2,33.4,10],[37.2,33.4,4],[36.9,31.6,1]],.5),
        color:0xb9bec4, lay:'up', at:[{pos:[0,0,0]}] },

      { id:'trim15', grp:'g-print', name:{fr:'Trim bâbord (15°)',en:'Port trim (15°)'},
        file:'models/boat_trim_15.STL', color:0x1c1c1e, lay:'up', explode:[-42,12,-26],
        at:[{pos:[30.088,10.681,0.054], rot:[Math.PI,0,-2.766277]}] },

      { id:'trim20', grp:'g-print', name:{fr:'Trim tribord (20°)',en:'Starboard trim (20°)'},
        file:'models/boat_trim_20.STL', color:0x1c1c1e, lay:'up', explode:[42,12,-26],
        at:[{pos:[79.827,16.959,0.054], rot:[Math.PI,0,2.766277]}] },

      { id:'servo', grp:'g-elec', name:{fr:'Servo 2 g',en:'2 g servo'},
        geo:servoGeo, color:0x2b2f36, lay:'up', at:[{pos:[48.6,31.57,47.05]}] },

      { id:'rcmount', grp:'g-print', name:{fr:'Support électronique',en:'Electronics tray'},
        file:'models/rc_mount.STL', color:0x3a4048, lay:'flip', explode:[0,46,12],
        at:[{pos:[72.25,29.29,106.83], rot:[-R2,0,R2]}] },

      /* Logements relevés dans la coque : deux gouttières cylindriques
         Ø18.68 (la cote exacte d'un 18650), axes à (25.90, 22.72) et
         (68.10, 22.72), ouvertes vers le haut sur 135° et fermées à l'arrière
         par le tableau (Z = 0.72). L'accu vient donc en butée sur ce fond. */
      { id:'battery', grp:'g-elec', name:{fr:'Accus 18650 3400 mAh',en:'18650 cells 3400 mAh'},
        geo:batteryGeo, color:0x2f6f4e, lay:'flat',
        at:[{pos:[25.90,22.72,34.60], rot:[R2,0,0]}, {pos:[68.10,22.72,34.60], rot:[R2,0,0]}] },

      { id:'esc', grp:'g-elec', name:{fr:'ESC 20 A',en:'20 A ESC'},
        geo:escGeo, color:0x1f1f24, lay:'up', at:[{pos:[37,37.8,80]}] },

      { id:'bec', grp:'g-elec', name:{fr:'BEC Recom R-78',en:'Recom R-78 BEC'},
        geo:becGeo, color:0x14161a, lay:'up', at:[{pos:[30,35.6,92]}] },

      { id:'rx', grp:'g-elec', name:{fr:'Récepteur 2.4 GHz',en:'2.4 GHz receiver'},
        geo:rxGeo, color:0x1a1d22, lay:'up', at:[{pos:[57,37.6,72]}] },

      { id:'wires', grp:'g-elec', name:{fr:'Câblage',en:'Wiring'},
        geo:wireGeo, color:0x24272c, lay:'up', at:[{pos:[0,0,0]}] },

      { id:'grub', grp:'g-fix', name:{fr:'Vis sans tête M2×3',en:'M2×3 grub screws'},
        geo:grubGeo, color:0x6f7681, lay:'flat',
        at:[{pos:[50,18.9,11.6], rot:[0,0,-R2]},{pos:[44,18.9,11.6], rot:[0,0,R2]},
            {pos:[47,21.9,87]},{pos:[47,21.9,95]},
            {pos:[36.0,36.2,42.5]},{pos:[36.0,36.2,39.5]}] },

      { id:'m2x6', grp:'g-fix', name:{fr:'Vis M2×6',en:'M2×6 screws'},
        geo:()=>screwGeo(6), color:0xd8dde3, lay:'flat',
        at:[{pos:[22,41.2,113.2]},{pos:[72,41.2,113.2]},{pos:[24.5,41.2,25]},{pos:[69.5,41.2,25]},
            {pos:[48.6,33.17,37.3]},{pos:[48.6,33.17,56.8]},
            {pos:[47,35.6,63.6]},{pos:[47,35.6,103.6]},
            {pos:[39,18.9,105], rot:[-R2,0,0]},{pos:[55,18.9,105], rot:[-R2,0,0]}] },

      { id:'m2x8', grp:'g-fix', name:{fr:'Vis M2×8',en:'M2×8 screws'},
        geo:()=>screwGeo(8), color:0xd8dde3, lay:'flat',
        at:[{pos:[31,18.9,-2.45], rot:[-R2,0,0]},{pos:[63,18.9,-2.45], rot:[-R2,0,0]},
            {pos:[47,34.9,-2.45], rot:[-R2,0,0]},{pos:[47,25.57,74.3]}] },

      { id:'m16x5', grp:'g-fix', name:{fr:'Vis M1.6×5',en:'M1.6×5 screws'},
        geo:()=>screwGeo(5,1.6), color:0xd8dde3, lay:'flat',
        at:[{pos:[47,32.71,-13.29]},{pos:[47,4.91,-13.29], rot:[Math.PI,0,0]}] },

      { id:'seal', grp:'g-fix', name:{fr:'Joint mousse Ø2',en:'Ø2 foam seal'},
        geo:sealGeo, color:0x30343a, lay:'up', at:[{pos:[0,0,0]}] },

      { id:'cover', grp:'g-print', name:{fr:'Couvercle',en:'Cover'},
        file:'models/boat_cover.STL', color:0x2b3550, lay:'flip', explode:[0,62,0],
        at:[{pos:[12.16,38.70,144.03], rot:[-R2,0,0]}] }
    ];

    /* ------------------------------------------------------------------ */
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d1117);
    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.5, 4000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.5;
    document.getElementById('canvas-wrap').appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    scene.add(new THREE.AmbientLight(0xffffff, .5));
    scene.add(new THREE.HemisphereLight(0xe0f0ff, 0x3a3a3a, 1.35));
    const d1 = new THREE.DirectionalLight(0xffffff, 2.3); d1.position.set(120, 180, 90); scene.add(d1);
    const d2 = new THREE.DirectionalLight(0xaaccff, 1.1); d2.position.set(-90, 70, -120); scene.add(d2);

    let grid = null;
    function setGrid(size) {
      if (grid) { scene.remove(grid); grid.geometry.dispose(); grid.material.dispose(); }
      grid = new THREE.GridHelper(size, Math.round(size / 25), 0x39424d, 0x232a32);
      grid.position.y = -0.05;
      grid.visible = document.getElementById('chk-grid').checked;
      scene.add(grid);
    }
    setGrid(400);

    const loader = new STLLoader();
    let loadedCount = 0;
    const items = [];      // une entrée par exemplaire

    function buildGeos(part) {
      return new Promise(resolve => {
        if (!part.file) { resolve(part.geo()); return; }
        loader.load(part.file, geo => {
          geo.computeVertexNormals();
          // Les STL gardent leur repère d'origine (aucun geo.center()) : pos[] les
          // place sur leurs portées réelles. Seule exception, une pièce tournante
          // doit avoir son axe sur l'origine du maillage, sinon elle décrit un
          // cercle au lieu de tourner sur elle-même.
          if (part.pivot) geo.translate(-part.pivot[0], -part.pivot[1], -part.pivot[2]);
          resolve([geo]);
        }, undefined, () => resolve([box(1, 1, 1)]));
      });
    }

    async function loadAll() {
      for (const part of PARTS) {
        const geos = await buildGeos(part);
        part.mat = new THREE.MeshLambertMaterial({ color: part.color, side: THREE.DoubleSide });
        part.objs = [];
        part.at.forEach(inst => {
          const o = new THREE.Group();
          geos.forEach(g => o.add(new THREE.Mesh(g, part.mat)));
          scene.add(o);
          part.objs.push(o);
          items.push({
            part, obj: o,
            asmPos: new THREE.Vector3(...inst.pos).add(G),
            asmQuat: new THREE.Quaternion().setFromEuler(new THREE.Euler(...(inst.rot ?? [0, 0, 0]))),
            layPos: new THREE.Vector3(), layQuat: new THREE.Quaternion(), lift: 0, t0: 0, t1: 1
          });
        });
        loadedCount++;
        document.getElementById('load-fill').style.width = (loadedCount / PARTS.length * 100) + '%';
      }
      layout();
      timeline();
      buildList();
      apply();
      fitCamera(true);
      document.getElementById('loading').classList.add('hidden');
    }

    /* --- disposition à plat : rangées de pièces posées sur le plan ------- */
    function layout() {
      const ROW_W = 330, GAP = 8;
      let cx = -ROW_W / 2, cz = 0, rowD = 0;
      const bb = new THREE.Box3(), sz = new THREE.Vector3(), ctr = new THREE.Vector3();
      for (const part of PARTS) {
        const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(
          part.lay === 'flat' ? R2 : part.lay === 'flip' ? -R2 : 0, 0, 0));
        part.objs.forEach(o => {
          o.quaternion.copy(q); o.position.set(0, 0, 0); o.updateMatrixWorld(true);
          bb.setFromObject(o); bb.getSize(sz); bb.getCenter(ctr);
          if (cx + sz.x > ROW_W / 2) { cx = -ROW_W / 2; cz += rowD + GAP * 2.4; rowD = 0; }
          const it = items.find(i => i.obj === o);
          it.layQuat.copy(q);
          it.layPos.set(cx + sz.x / 2 - ctr.x, -bb.min.y, cz + sz.z / 2 - ctr.z);
          cx += sz.x + GAP;
          rowD = Math.max(rowD, sz.z);
        });
      }
      // recentre la table de montage
      const zc = (cz + rowD) / 2;
      items.forEach(i => i.layPos.z -= zc);
      // le plan de travail épouse la table de montage (emprise réelle des pièces)
      const span = new THREE.Box3(), ib = new THREE.Box3();
      items.forEach(i => {
        i.obj.position.copy(i.layPos); i.obj.quaternion.copy(i.layQuat);
        i.obj.updateMatrixWorld(true);
        span.union(ib.setFromObject(i.obj));
      });
      setGrid(Math.ceil(Math.max(span.max.x - span.min.x, span.max.z - span.min.z) / 25 + 2) * 25);
    }

    /* --- fenêtre temporelle : un créneau par pièce, exemplaires décalés ---
       Découper par exemplaire donnerait 45 des 54 créneaux à la visserie ;
       chaque ligne de nomenclature reçoit donc une part égale du temps.   */
    function timeline() {
      const N = PARTS.length, SLOT = 0.20;
      let k = 0;
      PARTS.forEach((part, i) => {
        const base = (i / N) * (1 - SLOT);
        part.objs.forEach((o, j) => {
          const it = items.find(x => x.obj === o);
          it.t0 = base + (part.objs.length > 1 ? j / part.objs.length * SLOT * 0.45 : 0);
          it.t1 = it.t0 + SLOT * 0.55;
          it.lift = 12 + 26 * Math.abs(Math.sin(k++ * 2.399));
        });
      });
    }

    /* ------------------------------------------------------------------ */
    let asm = 0, explodeAmount = 0, target = null, spinAngle = 0;
    const smooth = u => u * u * (3 - 2 * u);
    const tmpV = new THREE.Vector3();

    function apply() {
      for (const it of items) {
        const u = smooth(THREE.MathUtils.clamp((asm - it.t0) / (it.t1 - it.t0), 0, 1));
        it.obj.position.lerpVectors(it.layPos, it.asmPos, u);
        it.obj.position.y += it.lift * Math.sin(Math.PI * u);
        it.obj.quaternion.slerpQuaternions(it.layQuat, it.asmQuat, u);
        if (explodeAmount > 0 && u > 0.999) {
          const e = it.part.explode;
          if (e) tmpV.set(e[0], e[1], e[2]);
          else tmpV.copy(it.asmPos).normalize().multiplyScalar(46);
          it.obj.position.addScaledVector(tmpV, explodeAmount / 100);
        }
      }
    }

    /* --- animation ------------------------------------------------------ */
    function goTo(v) { target = v; }
    function stepAnim(dt) {
      if (target === null) return;
      const dir = Math.sign(target - asm);
      asm = THREE.MathUtils.clamp(asm + dir * dt / 3.4, 0, 1);
      if ((dir > 0 && asm >= target) || (dir < 0 && asm <= target)) { asm = target; target = null; fitCamera(); }
      setAsm(asm, false);
    }

    function setAsm(v, stop = true) {
      asm = THREE.MathUtils.clamp(v, 0, 1);
      if (stop) target = null;
      document.getElementById('asm-slider').value = Math.round(asm * 100);
      document.getElementById('asm-val').textContent = Math.round(asm * 100) + '%';
      apply();
      showPhase();
      if (stop && (asm <= 0.001 || asm >= 0.999)) fitCamera();
    }

    const phaseEl = document.getElementById('phase');
    function showPhase() {
      let label = null;
      if (asm <= 0.001) label = t('ph-flat');
      else if (asm >= 0.999) label = t('ph-done');
      else {
        const moving = items.filter(i => asm > i.t0 && asm < i.t1);
        const p = (moving.length ? moving[moving.length - 1] : items[0]).part;
        label = p.name[lang];
      }
      phaseEl.textContent = label;
      phaseEl.classList.add('on');
      clearTimeout(showPhase.tid);
      showPhase.tid = setTimeout(() => phaseEl.classList.remove('on'), 1600);
    }

    /* --- cadrage -------------------------------------------------------- */
    let camGoal = null;
    function fitCamera(instant = false) {
      const bb = new THREE.Box3();
      items.forEach(i => { if (i.obj.visible) bb.expandByObject(i.obj); });
      if (bb.isEmpty()) return;
      const c = bb.getCenter(new THREE.Vector3());
      const tv = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2), th = tv * camera.aspect;
      const dir = new THREE.Vector3(0.78, 0.46, -0.72).normalize();
      const right = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0, 1, 0)).normalize();
      const up = new THREE.Vector3().crossVectors(right, dir).normalize();
      const p = new THREE.Vector3();
      let dist = 0;
      for (let i = 0; i < 8; i++) {
        p.set(i & 1 ? bb.max.x : bb.min.x, i & 2 ? bb.max.y : bb.min.y, i & 4 ? bb.max.z : bb.min.z).sub(c);
        const depth = p.dot(dir);
        dist = Math.max(dist, depth + Math.abs(p.dot(right)) / th, depth + Math.abs(p.dot(up)) / tv);
      }
      const pos = c.clone().addScaledVector(dir, dist * 1.1);
      if (instant) { controls.target.copy(c); camera.position.copy(pos); controls.update(); camGoal = null; }
      else camGoal = { c, pos };
    }
    function stepCam(dt) {
      if (!camGoal) return;
      const k = 1 - Math.pow(0.002, dt);
      controls.target.lerp(camGoal.c, k);
      camera.position.lerp(camGoal.pos, k);
      if (camera.position.distanceTo(camGoal.pos) < 0.4) camGoal = null;
    }

    /* --- inventaire ----------------------------------------------------- */
    const GROUPS = ['g-print', 'g-drive', 'g-elec', 'g-fix'];
    function buildList() {
      const list = document.getElementById('parts-list');
      list.innerHTML = '';
      let n = 0;
      for (const grp of GROUPS) {
        const h = document.createElement('div');
        h.className = 'grp-title'; h.dataset.grp = grp; h.textContent = t(grp);
        list.appendChild(h);
        for (const part of PARTS.filter(p => p.grp === grp)) {
          n += part.at.length;
          const lab = document.createElement('label');
          lab.className = 'chk';
          lab.innerHTML = `<input type="checkbox" checked>
            <span class="sw" style="background:#${part.color.toString(16).padStart(6, '0')}"></span>
            <span class="nm"></span><span class="qty">×${part.at.length}</span>`;
          const nm = lab.querySelector('.nm');
          nm.textContent = part.name[lang];
          nm.dataset.part = part.id;
          lab.querySelector('input').onchange = e => {
            part.objs.forEach(o => o.visible = e.target.checked);
          };
          list.appendChild(lab);
        }
      }
      document.getElementById('parts-count').textContent = `${n}`;
    }

    function setLang(l) {
      lang = l;
      document.getElementById('btn-fr').classList.toggle('active', l === 'fr');
      document.getElementById('btn-en').classList.toggle('active', l === 'en');
      document.querySelectorAll('[data-i18n]').forEach(e => e.textContent = t(e.dataset.i18n));
      document.querySelectorAll('.grp-title').forEach(e => e.textContent = t(e.dataset.grp));
      document.querySelectorAll('#parts-list .nm').forEach(e =>
        e.textContent = PARTS.find(p => p.id === e.dataset.part).name[lang]);
      showPhase();
    }

    /* --- commandes ------------------------------------------------------ */
    document.getElementById('btn-assemble').onclick = () => goTo(1);
    document.getElementById('btn-disassemble').onclick = () => goTo(0);
    document.getElementById('asm-slider').oninput = e => setAsm(+e.target.value / 100);
    document.getElementById('explode-slider').oninput = e => {
      explodeAmount = +e.target.value;
      document.getElementById('explode-val').textContent = explodeAmount + '%';
      if (explodeAmount > 0 && asm < 1) setAsm(1);
      else apply();
    };
    document.getElementById('btn-show-all').onclick = () => setAllVisible(true);
    document.getElementById('btn-hide-all').onclick = () => setAllVisible(false);
    function setAllVisible(v) {
      PARTS.forEach(p => p.objs.forEach(o => o.visible = v));
      document.querySelectorAll('#parts-list input').forEach(i => i.checked = v);
    }
    document.getElementById('btn-fit').onclick = () => fitCamera();
    document.getElementById('chk-wire').onchange = e => PARTS.forEach(p => p.mat.wireframe = e.target.checked);
    document.getElementById('chk-grid').onchange = e => grid.visible = e.target.checked;
    
    let autoRotate = false, spinOn = true;
    document.getElementById('chk-auto').onchange = e => autoRotate = e.target.checked;
    document.getElementById('chk-spin').onchange = e => spinOn = e.target.checked;
    document.getElementById('btn-fr').onclick = () => setLang('fr');
    document.getElementById('btn-en').onclick = () => setLang('en');

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      stepAnim(dt);
      stepCam(dt);
      if (spinOn) {
        spinAngle += dt * 12;
        PARTS.forEach(p => {
          if (!p.spin) return;
          p.at.forEach((inst, k) => {
            const e = inst.rot ?? [0, 0, 0];
            if (asm > 0.999) p.objs[k].rotation.set(e[0], e[1], e[2] + spinAngle);
          });
        });
      }
      controls.autoRotate = autoRotate;
      controls.update();
      renderer.render(scene, camera);
    }

    loadAll().then(animate);
  </script>
</body>
</html>
